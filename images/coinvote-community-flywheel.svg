<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">CoinVote community participation loop</title><desc id="desc">A community member votes, earns Nuggets, uses rewards or Boosts, increases project visibility and returns to participate again.</desc><rect width="1200" height="430" rx="24" fill="#0b1112"/><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#16221a" stroke="#8eae7c" stroke-width="2"><rect x="30" y="135" width="190" height="125" rx="16"/><rect x="270" y="135" width="190" height="125" rx="16"/><rect x="510" y="135" width="190" height="125" rx="16"/><rect x="750" y="135" width="190" height="125" rx="16"/><rect x="990" y="135" width="180" height="125" rx="16"/></g><g fill="#a8d98a" font-size="23" font-weight="700"><text x="125" y="190">VOTE</text><text x="365" y="190">EARN</text><text x="605" y="190">BOOST</text><text x="845" y="190">DISCOVER</text><text x="1080" y="190">RETURN</text></g><g fill="#f2ece4" font-size="15"><text x="125" y="224">Support a project</text><text x="365" y="224">Collect Nuggets</text><text x="605" y="224">Spend earned points</text><text x="845" y="224">More visibility</text><text x="1080" y="224">Keep participating</text></g><g stroke="#ffc45b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M220 197h42l-12-12m12 12-12 12M460 197h42l-12-12m12 12-12 12M700 197h42l-12-12m12 12-12 12M940 197h42l-12-12m12 12-12 12"/><path d="M1080 278v70H125v-70m0 0-12 12m12-12 12 12"/></g><text x="600" y="50" fill="#ffc45b" font-size="28" font-weight="700">THE COMMUNITY FLYWHEEL</text><text x="600" y="395" fill="#b9b1aa" font-size="16">A participation loop — not a promise of buyers, price appreciation or investment returns.</text></g></svg>