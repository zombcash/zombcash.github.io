<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Crypto portfolio category map</title><desc id="d">A neutral category map separating memecoins, governance tokens, stablecoins, NFTs and mining businesses.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17261b"/><stop offset="1" stop-color="#090d13"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="64" y="82" fill="#a6ff54" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">OUTBREAK TRANSMISSION / CATEGORY MAP</text><text x="64" y="145" fill="#f0f7ed" font-family="Arial,sans-serif" font-size="48" font-weight="700">NOT EVERY CRYPTO ASSET IS A MEMECOIN</text><g font-family="Arial,sans-serif"><g transform="translate(65 220)"><rect width="330" height="300" rx="22" fill="#142318" stroke="#a6ff54" stroke-width="3"/><circle cx="165" cy="90" r="42" fill="#a6ff54" opacity=".16" stroke="#a6ff54" stroke-width="3"/><path d="M145 90h40M165 70v40" stroke="#a6ff54" stroke-width="7" stroke-linecap="round"/><text x="165" y="175" text-anchor="middle" fill="#a6ff54" font-size="26" font-weight="700">MEMECOINS</text><text x="165" y="215" text-anchor="middle" fill="#e1ebdf" font-size="21">$TRUMP · $MELANIA</text><text x="165" y="255" text-anchor="middle" fill="#9fb39e" font-size="17">Speculative, personality-branded</text></g><g transform="translate(435 220)"><rect width="330" height="300" rx="22" fill="#111b16" stroke="#4cba6a" stroke-width="2"/><circle cx="165" cy="90" r="42" fill="#4cba6a" opacity=".16" stroke="#4cba6a" stroke-width="3"/><path d="M145 82h40M145 98h40M165 62v76" stroke="#4cba6a" stroke-width="6"/><text x="165" y="175" text-anchor="middle" fill="#7fe18a" font-size="26" font-weight="700">GOVERNANCE</text><text x="165" y="215" text-anchor="middle" fill="#e1ebdf" font-size="21">$WLFI</text><text x="165" y="255" text-anchor="middle" fill="#9fb39e" font-size="17">Voting / protocol rights</text></g><g transform="translate(805 220)"><rect width="330" height="300" rx="22" fill="#111b16" stroke="#4cba6a" stroke-width="2"/><circle cx="165" cy="90" r="42" fill="#4cba6a" opacity=".16" stroke="#4cba6a" stroke-width="3"/><path d="M165 58v64M133 90h64" stroke="#4cba6a" stroke-width="6"/><text x="165" y="175" text-anchor="middle" fill="#7fe18a" font-size="26" font-weight="700">STABLECOIN</text><text x="165" y="215" text-anchor="middle" fill="#e1ebdf" font-size="21">USD1</text><text x="165" y="255" text-anchor="middle" fill="#9fb39e" font-size="17">Designed to track a currency</text></g></g><rect x="65" y="555" width="1070" height="62" rx="12" fill="#263c2a"/><text x="600" y="594" text-anchor="middle" fill="#eff8eb" font-family="Arial,sans-serif" font-size="20" font-weight="700">NFT COLLECTIBLES AND MINING BUSINESSES ARE DIFFERENT CATEGORIES TOO</text></svg>