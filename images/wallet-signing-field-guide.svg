<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Wallet signing safety field guide</title><desc id="d">A wallet authorization panel surrounded by four security checks: verify source, inspect action, limit permissions, and pause if uncertain.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14271b"/><stop offset="1" stop-color="#080d13"/></linearGradient><linearGradient id="g"><stop stop-color="#a6ff54"/><stop offset="1" stop-color="#4cba6a"/></linearGradient></defs><rect width="1200" height="675" rx="34" fill="url(#bg)"/><g stroke="#294832" opacity=".5"><path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200M150 0V675M300 0V675M450 0V675M600 0V675M750 0V675M900 0V675M1050 0V675"/></g><text x="64" y="82" fill="#a6ff54" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">SURVIVOR FIELD MANUAL / 002</text><text x="64" y="145" fill="#f0f7ed" font-family="Arial,sans-serif" font-size="46" font-weight="700">PAUSE BEFORE YOU SIGN</text><rect x="435" y="205" width="330" height="370" rx="28" fill="#101a14" stroke="#a6ff54" stroke-width="3"/><rect x="465" y="242" width="270" height="64" rx="12" fill="#1b3020"/><circle cx="505" cy="274" r="14" fill="#a6ff54"/><text x="535" y="282" fill="#eff8eb" font-family="Arial,sans-serif" font-size="22" font-weight="700">WALLET REQUEST</text><path d="M475 350H725M475 390H690M475 430H710" stroke="#55715a" stroke-width="10" stroke-linecap="round"/><rect x="475" y="474" width="110" height="48" rx="12" fill="#294832"/><rect x="600" y="474" width="125" height="48" rx="12" fill="url(#g)"/><text x="530" y="505" text-anchor="middle" fill="#eaf6e8" font-family="Arial,sans-serif" font-size="17">REJECT</text><text x="662" y="505" text-anchor="middle" fill="#07110a" font-family="Arial,sans-serif" font-size="17" font-weight="700">VERIFY</text><g font-family="Arial,sans-serif"><g><circle cx="250" cy="265" r="48" fill="#1b3020" stroke="#a6ff54" stroke-width="3"/><path d="M230 265l14 14 28-32" fill="none" stroke="#a6ff54" stroke-width="8" stroke-linecap="round"/><text x="250" y="350" fill="#a6ff54" font-size="23" font-weight="700" text-anchor="middle">01 / SOURCE</text><text x="250" y="382" fill="#dce8da" font-size="18" text-anchor="middle">Is the site genuine?</text></g><g><circle cx="950" cy="265" r="48" fill="#1b3020" stroke="#a6ff54" stroke-width="3"/><path d="M925 265h50M950 240v50" stroke="#a6ff54" stroke-width="7" stroke-linecap="round"/><text x="950" y="350" fill="#a6ff54" font-size="23" font-weight="700" text-anchor="middle">02 / ACTION</text><text x="950" y="382" fill="#dce8da" font-size="18" text-anchor="middle">What are you approving?</text></g><g><circle cx="250" cy="490" r="48" fill="#1b3020" stroke="#a6ff54" stroke-width="3"/><path d="M250 458l28 12v24c0 18-12 31-28 39-16-8-28-21-28-39v-24z" fill="none" stroke="#a6ff54" stroke-width="6"/><text x="250" y="575" fill="#a6ff54" font-size="23" font-weight="700" text-anchor="middle">03 / ACCESS</text><text x="250" y="606" fill="#dce8da" font-size="18" text-anchor="middle">Are permissions limited?</text></g><g><circle cx="950" cy="490" r="48" fill="#1b3020" stroke="#a6ff54" stroke-width="3"/><path d="M950 458v35m0 20v2" stroke="#a6ff54" stroke-width="8" stroke-linecap="round"/><text x="950" y="575" fill="#a6ff54" font-size="23" font-weight="700" text-anchor="middle">04 / PAUSE</text><text x="950" y="606" fill="#dce8da" font-size="18" text-anchor="middle">Unsure? Reject and verify.</text></g></g><g stroke="#4cba6a" stroke-width="3" stroke-dasharray="8 10" fill="none"><path d="M300 265H435M765 265H900M300 490H435M765 490H900"/></g></svg>