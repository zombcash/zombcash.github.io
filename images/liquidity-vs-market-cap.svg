<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Valuation and executable liquidity are different</title>
<desc id="desc">A large valuation symbol is shown separately from a trading pool with finite reserves and a narrow exit path.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14271b"/><stop offset="1" stop-color="#0a1018"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c6ff83"/><stop offset="1" stop-color="#68d72d"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="8" y="8" width="1184" height="544" rx="30" fill="url(#bg)" stroke="#35533b" stroke-width="3"/>
<g opacity=".14" stroke="#9bff45" stroke-width="1"><path d="M40 110H1160M40 220H1160M40 330H1160M40 440H1160"/><path d="M180 35V525M420 35V525M660 35V525M900 35V525"/></g>
<g transform="translate(110 105)">
