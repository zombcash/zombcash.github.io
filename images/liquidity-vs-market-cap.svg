 <circle cx="180" cy="142" r="88" fill="#15291a" stroke="url(#green)" stroke-width="8" filter="url(#glow)"/>
 <text x="180" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="104" font-weight="800" fill="#baff83">$</text>
 <g fill="#9bff45" opacity=".9"><rect x="80" y="260" width="200" height="18" rx="9"/><rect x="105" y="292" width="150" height="12" rx="6" opacity=".55"/></g>
 <path d="M92 220H268" stroke="#a8c99a" stroke-width="3" stroke-dasharray="8 12" opacity=".65"/>
</g>
<g transform="translate(730 105)">
 <rect width="360" height="350" rx="24" fill="#0c1711" stroke="#4c7547" stroke-width="3"/>
 <path d="M70 110H290L255 225H105Z" fill="#132a1a" stroke="#9bff45" stroke-width="5"/>
 <path d="M105 225L130 270H230L255 225" fill="#1e4226" stroke="#9bff45" stroke-width="4"/>
 <g fill="url(#green)" stroke="#d7ffad" stroke-width="2"><circle cx="135" cy="157" r="24"/><circle cx="185" cy="157" r="24"/><circle cx="235" cy="157" r="24"/></g>
 <path d="M180 270V315" stroke="#9bff45" stroke-width="8" stroke-linecap="round"/>
