<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">ZombieCash survivor swap terminal</title>
<desc id="desc">A rugged survivor terminal shows ZOMBCASH and Solana tokens swapping, with a wallet and ruined city under toxic green light.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#182522"/><stop offset=".52" stop-color="#0c1513"/><stop offset="1" stop-color="#050909"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#142d1b"/><stop offset="1" stop-color="#07130d"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#65716b"/><stop offset=".22" stop-color="#202b27"/><stop offset=".75" stop-color="#0b1210"/><stop offset="1" stop-color="#39443e"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#b7ff4a"/><stop offset="1" stop-color="#43b900"/></linearGradient>
 <linearGradient id="purple" x2="0" y2="1"><stop stop-color="#73f4ff"/><stop offset="1" stop-color="#7a38dc"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#69db21" stop-opacity=".34"/><stop offset="1" stop-color="#69db21" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8aff45" stroke-opacity=".12"/></pattern>
</defs>
