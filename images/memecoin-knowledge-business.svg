<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Sell the map, not the memecoin lottery ticket</title><desc id="d">ZombieCash editorial graphic contrasting speculative memecoin trading with a knowledge business built on research, checklists, tools and education.</desc><rect width="1200" height="675" fill="#080b11"/><circle cx="1000" cy="90" r="260" fill="#16341f"/><g font-family="system-ui,sans-serif"><text x="68" y="78" fill="#9bff45" font-size="24" font-weight="800" letter-spacing="5">ZOMBIECASH FIELD MANUAL</text><text x="68" y="155" fill="#edf5eb" font-size="56" font-weight="900">SELL THE MAP.</text><text x="68" y="220" fill="#edf5eb" font-size="56" font-weight="900">NOT THE LOTTERY TICKET.</text><text x="70" y="273" fill="#a6b5a5" font-size="23">A knowledge business beats pretending to predict every candle.</text><g transform="translate(70 335)"><rect width="315" height="230" rx="16" fill="#101a13" stroke="#2b4030" stroke-width="2"/><text x="24" y="45" fill="#ff766e" font-size="20" font-weight="800">THE GAMBLE</text><path d="M35 88L88 65L127 120L178 92L230 155L278 182" fill="none" stroke="#ff766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="211" fill="#edf5eb" font-size="19">Hype · thin liquidity · luck</text></g><g transform="translate(440 335)"><rect width="315" height="230" rx="16" fill="#101a13" stroke="#2b4030" stroke-width="2"/><text x="24" y="45" fill="#9bff45" font-size="20" font-weight="800">THE KNOW-HOW</text><rect x="28" y="68" width="255" height="42" rx="6" fill="#213b26"/><text x="43" y="95" fill="#edf5eb" font-size="18">Research + sources</text><rect x="28" y="120" width="255" height="42" rx="6" fill="#213b26"/><text x="43" y="147" fill="#edf5eb" font-size="18">Tools + checklists</text><rect x="28" y="172" width="255" height="36" rx="6" fill="#9bff45"/><text x="43" y="196" fill="#071008" font-size="18" font-weight="800">Education + trust</text></g><g transform="translate(810 335)"><rect width="320" height="230" rx="16" fill="#101a13" stroke="#2b4030" stroke-width="2"/><text x="24" y="45" fill="#9bff45" font-size="20" font-weight="800">THE RULE</text><text x="24" y="92" fill="#edf5eb" font-size="23" font-weight="700">No guaranteed</text><text x="24" y="123" fill="#edf5eb" font-size="23" font-weight="700">returns.</text><text x="24" y="163" fill="#a6b5a5" font-size="17">Show the method.</text><text x="24" y="190" fill="#a6b5a5" font-size="17">Disclose incentives.</text><text x="24" y="216" fill="#a6b5a5" font-size="17">Correct your mistakes.</text></g><text x="70" y="625" fill="#718170" font-size="15">EDUCATION ONLY · MEMECOINS CAN LOSE MOST OR ALL OF THEIR VALUE</text></g></svg>