<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Memecoin research knowledge business model</title><desc id="d">A four-stage process from public research to practical learning tools, trusted community and sustainable educational products.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17261b"/><stop offset="1" stop-color="#090d13"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="url(#bg)"/><text x="64" y="82" fill="#a6ff54" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">SURVIVOR FIELD MANUAL / KNOWLEDGE ECONOMY</text><text x="64" y="145" fill="#f0f7ed" font-family="Arial,sans-serif" font-size="48" font-weight="700">SELL THE MAP, NOT THE LOTTERY TICKET</text><g font-family="Arial,sans-serif"><g transform="translate(65 240)"><rect width="230" height="220" rx="20" fill="#142318" stroke="#a6ff54" stroke-width="2"/><circle cx="115" cy="65" r="30" fill="#a6ff54" opacity=".18" stroke="#a6ff54" stroke-width="3"/><path d="M98 65h34M115 48v34" stroke="#a6ff54" stroke-width="5"/><text x="115" y="130" text-anchor="middle" fill="#a6ff54" font-size="22" font-weight="700">RESEARCH</text><text x="115" y="166" text-anchor="middle" fill="#e1ebdf" font-size="17">Sources + risks</text><text x="115" y="192" text-anchor="middle" fill="#9fb39e" font-size="15">Show your method</text></g><g transform="translate(355 240)"><rect width="230" height="220" rx="20" fill="#142318" stroke="#4cba6a" stroke-width="2"/><circle cx="115" cy="65" r="30" fill="#4cba6a" opacity=".18" stroke="#4cba6a" stroke-width="3"/><path d="M98 54h34v22H98zM105 84h20" fill="none" stroke="#7fe18a" stroke-width="4"/><text x="115" y="130" text-anchor="middle" fill="#7fe18a" font-size="22" font-weight="700">TEACH</text><text x="115" y="166" text-anchor="middle" fill="#e1ebdf" font-size="17">Guides + tools</text><text x="115" y="192" text-anchor="middle" fill="#9fb39e" font-size="15">Make it repeatable</text></g><g transform="translate(645 240)"><rect width="230" height="220" rx="20" fill="#142318" stroke="#4cba6a" stroke-width="2"/><circle cx="115" cy="65" r="30" fill="#4cba6a" opacity=".18" stroke="#7fe18a" stroke-width="3"/><circle cx="105" cy="60" r="8" fill="none" stroke="#7fe18a" stroke-width="3"/><circle cx="127" cy="60" r="8" fill="none" stroke="#7fe18a" stroke-width="3"/><path d="M92 82q13-18 26 0q13-18 26 0" fill="none" stroke="#7fe18a" stroke-width="3"/><text x="115" y="130" text-anchor="middle" fill="#7fe18a" font-size="22" font-weight="700">COMMUNITY</text><text x="115" y="166" text-anchor="middle" fill="#e1ebdf" font-size="17">Feedback + trust</text><text x="115" y="192" text-anchor="middle" fill="#9fb39e" font-size="15">No fake urgency</text></g><g transform="translate(935 240)"><rect width="200" height="220" rx="20" fill="#142318" stroke="#a6ff54" stroke-width="2"/><circle cx="100" cy="65" r="30" fill="#a6ff54" opacity=".18" stroke="#a6ff54" stroke-width="3"/><path d="M84 72h32M100 52v40" stroke="#a6ff54" stroke-width="5"/><text x="100" y="130" text-anchor="middle" fill="#a6ff54" font-size="22" font-weight="700">PRODUCT</text><text x="100" y="166" text-anchor="middle" fill="#e1ebdf" font-size="17">Useful + fair</text><text x="100" y="192" text-anchor="middle" fill="#9fb39e" font-size="15">Value, not hype</text></g></g><g fill="none" stroke="#a6ff54" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M305 350h40m-12-12 12 12-12 12M595 350h40m-12-12 12 12-12 12M885 350h40m-12-12 12 12-12 12"/></g><text x="600" y="555" text-anchor="middle" fill="#dce8da" font-family="Arial,sans-serif" font-size="22">Transparent sources · clear limitations · no guaranteed returns</text></svg>