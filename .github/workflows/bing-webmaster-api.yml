name: Bing Webmaster API Report

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bing-webmaster-api.yml"
      - "robots.txt"
      - "sitemap.xml"
      - "sitemap-*.xml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  bing-webmaster-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Bing Webmaster API
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BING_SITE_URL: https://zombcash.github.io/
        run: |
          set -euo pipefail
          if [ -z "${BING_WEBMASTER_API_KEY:-}" ]; then
            echo "::error::Missing repository secret BING_WEBMASTER_API_KEY."
            exit 1
          fi

          python3 <<'PY'
          import concurrent.futures
          import datetime
          import json
          import os
          import sys
          import threading
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          key = os.environ["BING_WEBMASTER_API_KEY"]
          site = os.environ["BING_SITE_URL"]
          base = "https://ssl.bing.com/webmaster/api.svc/json/"
          # Discover every sitemap declared by the live robots.txt and submit
          # each feed to Bing. GetFeeds alone only reports feeds already known to Bing.
          robots_url = urllib.parse.urljoin(site, "robots.txt")
          robots_request = urllib.request.Request(
              robots_url, headers={"User-Agent": "ZombieCash-Bing-Webmaster-Report/1.0"}
          )
          with urllib.request.urlopen(robots_request, timeout=25) as response:
              robots_text = response.read().decode("utf-8", "replace")
          sitemap_urls = list(dict.fromkeys(
              line.split(":", 1)[1].strip()
              for line in robots_text.splitlines()
              if line.lower().startswith("sitemap:")
          ))
          if not sitemap_urls:
              raise SystemExit("ERROR: robots.txt contains no Sitemap directives.")
          if any(not url.startswith(site) for url in sitemap_urls):
              raise SystemExit("ERROR: robots.txt references a sitemap outside the configured site.")

          submissions = []
          warnings = []
          for feed_url in sitemap_urls:
              params = urllib.parse.urlencode({"apikey": key})
              body = json.dumps({"siteUrl": site, "feedUrl": feed_url}).encode("utf-8")
              request = urllib.request.Request(
                  base + "SubmitFeed?" + params,
                  data=body,
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json; charset=utf-8",
                      "User-Agent": "ZombieCash-Bing-Webmaster-Report/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      response.read()
                      submissions.append({"url": feed_url, "http_status": response.status})
                      print(f"SubmitFeed: HTTP {response.status}; {feed_url}")
              except urllib.error.HTTPError as exc:
                  error_body = exc.read().decode("utf-8", "replace")[:1000]
                  if exc.code == 400 and "ThrottleHost" in error_body:
                      warning = f"Bing throttled sitemap submission for {feed_url} (ThrottleHost, ErrorCode 5)."
                      warnings.append(warning)
                      submissions.append({
                          "url": feed_url,
                          "http_status": exc.code,
                          "status": "throttled",
                          "error_code": 5,
                      })
                      print(f"::warning::{warning} No retry will be attempted in this run.")
                      continue
                  print(f"::error::SubmitFeed failed for {feed_url}: HTTP {exc.code}. {error_body}")
                  sys.exit(1)

          calls = {
              "rank_and_traffic": "GetRankAndTrafficStats",
              "query_stats": "GetQueryStats",
              "crawl_stats": "GetCrawlStats",
              "crawl_issues": "GetCrawlIssues",
              "sitemaps": "GetFeeds",
              # Bing exposes fetched-URL records separately from aggregate crawl
              # statistics. This distinguishes discovered sitemap URLs from URLs
              # Bing has actually fetched.
              "fetched_urls": "GetFetchedUrls",
          }
          report = {
              "sitemap_submissions": submissions,
              "site": site,
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source": "Bing Webmaster API",
              "results": {},
              "warnings": warnings,
          }

          for name, method in calls.items():
              params = urllib.parse.urlencode({"siteUrl": site, "apikey": key})
              request = urllib.request.Request(
                  base + method + "?" + params,
                  headers={"Accept": "application/json", "User-Agent": "ZombieCash-Bing-Webmaster-Report/1.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      status = response.status
                      payload = json.loads(response.read().decode("utf-8"))
                  data = payload.get("d", payload) if isinstance(payload, dict) else payload
                  report["results"][name] = {
                      "http_status": status,
                      "record_count": len(data) if isinstance(data, list) else None,
                      "data": data,
                  }
                  print(f"{method}: HTTP {status}; response received.")
              except urllib.error.HTTPError as exc:
                  # Never print the request URL: it contains the API key.
                  body = exc.read().decode("utf-8", "replace")[:1000]
                  if exc.code == 400 and "ThrottleHost" in body:
                      warning = f"{method} was throttled by Bing (ThrottleHost, ErrorCode 5)."
                      warnings.append(warning)
                      report["results"][name] = {
                          "http_status": exc.code,
                          "status": "throttled",
                          "error_code": 5,
                      }
                      print(f"::warning::{warning} The next scheduled report will try again.")
                      continue
                  print(f"::error::{method} returned HTTP {exc.code}. Response: {body}")
                  sys.exit(1)
              except Exception as exc:
                  print(f"::error::{method} failed ({type(exc).__name__}). Details omitted to protect credentials.")
                  sys.exit(1)

          # Fetch URL-level crawl records for the whole verified host. These
          # records describe discovery/fetching and HTTP status; they are not
          # an independent indexed/not-indexed verdict.
          domain_query = "domain:zombcash.github.io"
          domain_params = urllib.parse.urlencode({
              "siteUrl": site, "url": domain_query, "apikey": key
          })
          domain_request = urllib.request.Request(
              base + "GetUrlInfo?" + domain_params,
              headers={"Accept": "application/json", "User-Agent": "ZombieCash-Bing-Webmaster-Report/1.0"},
          )
          try:
              with urllib.request.urlopen(domain_request, timeout=25) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              domain_info = payload.get("d", payload) if isinstance(payload, dict) else payload
              report["results"]["directory_info"] = {
                  "http_status": 200,
                  "data": domain_info,
              }
              print("GetUrlInfo(domain): HTTP 200; directory details received.")
          except Exception as exc:
              warning = f"GetUrlInfo(domain) unavailable ({type(exc).__name__})."
              warnings.append(warning)
              report["results"]["directory_info"] = {
                  "status": "unavailable",
                  "error_type": type(exc).__name__,
              }
              print(f"::warning::{warning}")

          directory_records = []
          directory_pages = 0
          directory_truncated = False
          for page in range(100):
              params = urllib.parse.urlencode({"apikey": key})
              body = json.dumps({
                  "siteUrl": site,
                  "url": domain_query,
                  "page": page,
                  "filterProperties": {
                      "__type": "FilterProperties:#Microsoft.Bing.Webmaster.Api",
                      "CrawlDateFilter": 0,
                      "DiscoveredDateFilter": 0,
                      "DocFlagsFilters": 0,
                      "HttpCodeFilters": 0,
                  },
              }).encode("utf-8")
              request = urllib.request.Request(
                  base + "GetChildrenUrlInfo?" + params,
                  data=body,
                  headers={
                      "Accept": "application/json",
                      "Content-Type": "application/json; charset=utf-8",
                      "User-Agent": "ZombieCash-Bing-Webmaster-Report/1.0",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  data = payload.get("d", payload) if isinstance(payload, dict) else payload
                  if not isinstance(data, list) or not data:
                      break
                  directory_records.extend(data)
                  directory_pages += 1
                  print(f"GetChildrenUrlInfo: page {page + 1}; {len(data)} URL record(s).")
              except Exception as exc:
                  warning = f"GetChildrenUrlInfo page {page} unavailable ({type(exc).__name__})."
                  warnings.append(warning)
                  print(f"::warning::{warning}")
                  break
              if page == 99:
                  directory_truncated = True
              time.sleep(0.2)

          report["results"]["directory_children"] = {
              "record_count": len(directory_records),
              "page_count": directory_pages,
              "truncated_at_100_pages": directory_truncated,
              "data": directory_records,
          }
          print(
              f"Bing URL-level crawl records: {len(directory_records)} "
              f"across {directory_pages} page(s)."
          )

          # Inspect every page URL in the published sitemap feeds individually.
          # GetFetchedUrls can be empty even when aggregate CrawlStats reports indexed
          # pages, so retain both aggregate metrics and per-URL discovery/crawl details.
          page_urls = set()
          visited_sitemaps = set()

          def collect_page_urls(feed_url):
              if feed_url in visited_sitemaps:
                  return
              if not feed_url.startswith(site):
                  raise RuntimeError("Sitemap URL is outside the configured site.")
              visited_sitemaps.add(feed_url)
              request = urllib.request.Request(
                  feed_url, headers={"User-Agent": "ZombieCash-Bing-Webmaster-Report/1.0"}
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  root = ET.fromstring(response.read())
              root_kind = root.tag.rsplit("}", 1)[-1]
              if root_kind == "sitemapindex":
                  for entry in root:
                      if entry.tag.rsplit("}", 1)[-1] != "sitemap":
                          continue
                      child = next(
                          (node.text or "").strip()
                          for node in entry
                          if node.tag.rsplit("}", 1)[-1] == "loc"
                      )
                      collect_page_urls(child)
              elif root_kind == "urlset":
                  for entry in root:
                      if entry.tag.rsplit("}", 1)[-1] != "url":
                          continue
                      loc = next(
                          ((node.text or "").strip())
                          for node in entry
                          if node.tag.rsplit("}", 1)[-1] == "loc"
                      )
                      if loc.startswith(site):
                          page_urls.add(loc)
              else:
                  raise RuntimeError(f"Unsupported sitemap XML root: {root_kind}")

          try:
              for feed_url in sitemap_urls:
                  collect_page_urls(feed_url)
          except Exception as exc:
              warning = f"Could not enumerate sitemap page URLs ({type(exc).__name__})."
              warnings.append(warning)
              print(f"::warning::{warning}")

          page_url_list = sorted(page_urls)
          print(f"Unique page URLs found in published sitemaps: {len(page_url_list)}")

          # GetUrlInfo is a per-URL endpoint. Pace calls globally and keep each
          # worker's response in the report; never print request URLs because the
          # API key is part of the query string.
          url_info_lock = threading.Lock()
          url_info_next_start = [0.0]
          url_info_stop = threading.Event()

          def inspect_bing_url(url):
              if url_info_stop.is_set():
                  return {"url": url, "status": "skipped_after_api_limit"}
              with url_info_lock:
                  delay = url_info_next_start[0] - time.monotonic()
                  if delay > 0:
                      time.sleep(delay)
                  if url_info_stop.is_set():
                      return {"url": url, "status": "skipped_after_api_limit"}
                  url_info_next_start[0] = time.monotonic() + 0.25

              params = urllib.parse.urlencode({
                  "siteUrl": site, "url": url, "apikey": key
              })
              request = urllib.request.Request(
                  base + "GetUrlInfo?" + params,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "ZombieCash-Bing-Webmaster-Report/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  data = payload.get("d", payload) if isinstance(payload, dict) else payload
                  return {
                      "url": url,
                      "status": "ok",
                      "is_page": data.get("IsPage") if isinstance(data, dict) else None,
                      "http_status": data.get("HttpStatus") if isinstance(data, dict) else None,
                      "discovery_date": data.get("DiscoveryDate") if isinstance(data, dict) else None,
                      "last_crawled_date": data.get("LastCrawledDate") if isinstance(data, dict) else None,
                      "anchor_count": data.get("AnchorCount") if isinstance(data, dict) else None,
                      "total_child_url_count": data.get("TotalChildUrlCount") if isinstance(data, dict) else None,
                  }
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:500]
                  throttled = exc.code == 400 and "ThrottleHost" in body
                  if exc.code in (401, 403, 429) or throttled:
                      url_info_stop.set()
                  return {
                      "url": url,
                      "status": "throttled" if throttled else "http_error",
                      "http_status": exc.code,
                      "error_code": 5 if throttled else None,
                      "error": body,
                  }
              except Exception as exc:
                  return {
                      "url": url,
                      "status": "request_error",
                      "error_type": type(exc).__name__,
                  }

          url_info_records = []
          if page_url_list:
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
                  for index, record in enumerate(
                      executor.map(inspect_bing_url, page_url_list), start=1
                  ):
                      url_info_records.append(record)
                      if index % 50 == 0 or index == len(page_url_list):
                          print(
                              f"Bing per-URL inspection: {index}/{len(page_url_list)} "
                              f"scheduled; API stop={url_info_stop.is_set()}."
                          )

          url_info_counts = {}
          for record in url_info_records:
              state = record.get("status", "unknown")
              url_info_counts[state] = url_info_counts.get(state, 0) + 1
          report["url_level_inspection"] = {
              "method": "GetUrlInfo",
              "scope": "unique page URLs discovered in robots.txt sitemap feeds",
              "unique_page_urls": len(page_url_list),
              "request_interval_seconds": 0.25,
              "records": url_info_records,
              "status_counts": url_info_counts,
              "stopped_after_api_limit": url_info_stop.is_set(),
          }
          print(
              "Bing per-URL inspection complete: "
              + json.dumps(url_info_counts, sort_keys=True)
          )

          Path("bing-webmaster-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          if warnings:
              print(f"::warning::Bing report completed with {len(warnings)} throttled request(s). The daily schedule will retry; no rapid retry was attempted.")
          else:
              print("Bing Webmaster API authentication and report retrieval succeeded.")
          PY

      - name: Upload private-run report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bing-webmaster-report
          path: bing-webmaster-report.json
          if-no-files-found: error
          retention-days: 14
