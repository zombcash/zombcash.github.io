name: Sync ZombieCash homepage tool banners
on:
  workflow_dispatch:
    inputs:
      radar_url:
        description: One-time Dropbox download URL for the green Meme Radar banner
        required: true
        type: string
      lab_url:
        description: One-time Dropbox download URL for the purple Zombie Lab banner
        required: true
        type: string
      network_url:
        description: One-time Dropbox download URL for the red Survivor Network banner
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: zombcash-tool-banner-sync
  cancel-in-progress: false
jobs:
  sync-banners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mask temporary Dropbox URLs
        shell: bash
        env:
          RADAR_URL: ${{ inputs.radar_url }}
          LAB_URL: ${{ inputs.lab_url }}
          NETWORK_URL: ${{ inputs.network_url }}
        run: |
          echo "::add-mask::$RADAR_URL"
          echo "::add-mask::$LAB_URL"
          echo "::add-mask::$NETWORK_URL"
      - name: Download the three approved banner sources
        shell: bash
        env:
          RADAR_URL: ${{ inputs.radar_url }}
          LAB_URL: ${{ inputs.lab_url }}
          NETWORK_URL: ${{ inputs.network_url }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$RADAR_URL" -o /tmp/meme-radar-source
          curl --fail --location --silent --show-error "$LAB_URL" -o /tmp/zombie-lab-source
          curl --fail --location --silent --show-error "$NETWORK_URL" -o /tmp/survivor-network-source
          test -s /tmp/meme-radar-source
          test -s /tmp/zombie-lab-source
          test -s /tmp/survivor-network-source
      - name: Convert to matching full-bleed JPG banners
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          jobs = [
              ("/tmp/meme-radar-source", "assets/tools/meme-radar.jpg"),
              ("/tmp/zombie-lab-source", "assets/tools/zombie-lab.jpg"),
              ("/tmp/survivor-network-source", "assets/tools/survivor-network.jpg"),
          ]
          for source, target in jobs:
              with Image.open(source) as original:
                  if original.width < 1000 or original.height < 400:
                      raise SystemExit(f"Source image too small: {source} {original.size}")
                  image = ImageOps.fit(
                      original.convert("RGB"),
                      (1600, 640),
                      method=Image.Resampling.LANCZOS,
                      centering=(0.5, 0.5),
                  )
                  image.save(target, "JPEG", quality=88, optimize=True, progressive=True, subsampling=0)
              print(f"{target}: {Path(target).stat().st_size} bytes")
          PY
      - name: Commit and push all three banners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tools/meme-radar.jpg assets/tools/zombie-lab.jpg assets/tools/survivor-network.jpg
          git diff --cached --quiet && { echo "Banner files are already current"; exit 0; }
          git commit -m "Update all three homepage tool card banners"
          git push origin HEAD:main
