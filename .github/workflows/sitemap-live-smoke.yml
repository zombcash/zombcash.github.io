name: Full sitemap live-page validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'sitemap-*.xml'
      - 'robots.txt'
      - '*.html'
      - '**/*.html'
      - 'tests/sitemap-live-smoke.py'
      - '.github/workflows/sitemap-live-smoke.yml'
  schedule:
    - cron: '37 2 * * *'
  workflow_run:
    workflows: ["Deploy ZombieCash static site to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep validations for different deployments independent; an older deployment must not block the latest sitemap check.
  group: sitemap-live-validation-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  live-pages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Validate live sitemap checker syntax
        run: python -m py_compile tests/sitemap-live-smoke.py
      - name: Skip stale validation when a newer main commit exists
        id: freshness
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          latest_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_main" != "$VALIDATED_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Skipping stale sitemap validation for $VALIDATED_SHA; main is now $latest_main."
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Allow GitHub Pages to finish publishing
        if: steps.freshness.outputs.superseded != 'true'
        run: sleep 45
      - name: Validate all sitemap URLs against the live site
        if: steps.freshness.outputs.superseded != 'true'
        run: python tests/sitemap-live-smoke.py
