name: Full sitemap live-page validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - '*.html'
      - '**/*.html'
      - 'tests/sitemap-live-smoke.py'
      - '.github/workflows/sitemap-live-smoke.yml'
  schedule:
    - cron: '37 2 * * *'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sitemap-live-validation
  cancel-in-progress: true

jobs:
  live-pages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Allow GitHub Pages to finish publishing
        run: sleep 45
      - name: Validate all sitemap URLs against the live site
        run: python tests/sitemap-live-smoke.py
