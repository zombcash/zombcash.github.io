name: Core Web Vitals Lighthouse Preview

on:
  push:
    branches: [cwv-performance-20261104]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "shared-nav.js"
      - "whitepaper.html"
      - "tests/cwv-static-smoke.cjs"
      - ".github/workflows/cwv-lighthouse-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwv-lighthouse-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static performance safety checks
        run: node tests/cwv-static-smoke.cjs
      - name: Install pinned Lighthouse
        run: npm install --no-save lighthouse@13.6.0
      - name: Start local candidate site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zombcash-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zombcash-http.log
          exit 1
      - name: Run mobile and desktop Lighthouse audits
        run: |
          mkdir -p lighthouse-reports
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          for page in home gallery whitepaper; do
            case "$page" in
              home) url="http://127.0.0.1:4173/" ;;
              gallery) url="http://127.0.0.1:4173/gallery.html" ;;
              whitepaper) url="http://127.0.0.1:4173/whitepaper.html" ;;
            esac
            npx lighthouse "$url" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-web-security" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lighthouse-reports/${page}-mobile.json" --max-wait-for-load=45000
            npx lighthouse "$url" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-web-security" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lighthouse-reports/${page}-desktop.json" --max-wait-for-load=45000
          done
      - name: Audit current production pages for field baseline
        run: |
          mkdir -p lighthouse-reports
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for page in home gallery whitepaper; do
            case "$page" in
              home) url="https://zombcash.github.io/" ;;
              gallery) url="https://zombcash.github.io/gallery.html" ;;
              whitepaper) url="https://zombcash.github.io/whitepaper.html" ;;
            esac
            npx lighthouse "$url" --quiet --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-web-security" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lighthouse-reports/production-${page}-mobile.json" --max-wait-for-load=45000
            npx lighthouse "$url" --quiet --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-web-security" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path="lighthouse-reports/production-${page}-desktop.json" --max-wait-for-load=45000
          done
      - name: Publish lab metrics summary
        if: always()
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          console.log('| Page | Device | Performance | LCP (s) | CLS | TBT (ms) | SEO | Accessibility | Best practices |');
          console.log('|---|---|---:|---:|---:|---:|---:|---:|---:|');
          if (fs.existsSync('lighthouse-reports')) {
            for (const file of fs.readdirSync('lighthouse-reports').filter(x => x.endsWith('.json')).sort()) {
              const r = JSON.parse(fs.readFileSync('lighthouse-reports/' + file, 'utf8'));
              const a = r.audits || {};
              const score = id => r.categories?.[id]?.score == null ? 'n/a' : Math.round(r.categories[id].score * 100);
              const metric = (id, scale=1) => a[id]?.numericValue == null ? 'n/a' : (a[id].numericValue / scale).toFixed(2);
              const page = file.replace(/-(mobile|desktop)\.json$/, '');
              const device = file.includes('-mobile') ? 'Mobile' : 'Desktop';
              console.log(`|${page}|${device}|${score('performance')}|${metric('largest-contentful-paint',1000)}|${metric('cumulative-layout-shift')}|${metric('total-blocking-time')}|${score('seo')}|${score('accessibility')}|${score('best-practices')}|`);
            }
          }
          console.log('');
          console.log('These are Lighthouse lab results, not field CrUX data. INP requires field data and is not inferred from TBT.');
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zombcash-cwv-lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: warn
          retention-days: 14
