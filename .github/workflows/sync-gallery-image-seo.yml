name: Sync gallery image SEO assets

on:
  # Manual recovery/maintenance only. Hourly Telegram sync is the single
  # authoritative writer for gallery-data.json, crawlable cards and sitemaps.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zombie-gallery-sync
  cancel-in-progress: false

jobs:
  sync-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate crawlable gallery and image sitemap
        run: python scripts/sync_gallery_image_seo.py
      - name: Generate localized gallery pages
        run: python scripts/generate_localized_gallery_pages.py
      - name: Validate gallery outputs
        run: python tests/gallery-feature-static-smoke.py
      - name: Commit generated SEO assets when changed
        run: |
          if git diff --quiet -- gallery.html sitemap-gallery-images.xml sitemap-gallery-pages.xml robots.txt de/gallery.html fr/gallery.html it/gallery.html ja/gallery.html zh-CN/gallery.html ru/gallery.html tr/gallery.html hi/gallery.html; then
            echo "Gallery SEO assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.html sitemap-gallery-images.xml sitemap-gallery-pages.xml robots.txt de/gallery.html fr/gallery.html it/gallery.html ja/gallery.html zh-CN/gallery.html ru/gallery.html tr/gallery.html hi/gallery.html
          git commit -m "SEO: sync gallery image index"
          git push
