name: Draft Meridian translations (free offline Qwen3)

on:
  workflow_dispatch:
    inputs:
      language:
        description: Target language
        required: true
        type: choice
        options: [ru, de, fr, it, ja, zh-CN, tr, hi]
      chapter:
        description: sample, all, prologue, or chapter number 01–46
        required: true
        default: sample
        type: string

permissions:
  contents: write

concurrency:
  group: meridian-qwen-translation-${{ inputs.language }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore Qwen model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: qwen3-4b-instruct-2507-q5km-v1
      - name: Install CPU inference runtime
        run: python -m pip install --disable-pip-version-check --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu/llama-cpp-python/ numpy==1.26.4 llama-cpp-python==0.3.38 huggingface_hub==0.34.4 beautifulsoup4==4.13.4
      - name: Prepare language draft branch
        env:
          TARGET_LANGUAGE: ${{ inputs.language }}
        run: |
          BRANCH="translation-qwen-draft/$TARGET_LANGUAGE"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BRANCH"
          fi
          echo "TRANSLATION_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Generate translation draft
        env:
          HF_HOME: ~/.cache/huggingface
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/translate_meridian_qwen.py --language "${{ inputs.language }}" --chapter "${{ inputs.chapter }}"
      - name: Push translation draft branch
        env:
          TARGET_LANGUAGE: ${{ inputs.language }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No translated files changed."
            exit 0
          fi
          git commit -m "Draft Qwen3 translation of THE MERIDIAN OF ASH ($TARGET_LANGUAGE)"
          git push --set-upstream origin "$TRANSLATION_BRANCH"
