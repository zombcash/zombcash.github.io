name: Draft Meridian translations (free offline TranslateGemma)

on:
  workflow_dispatch:
    inputs:
      language:
        description: Target language
        required: true
        type: choice
        options: [ru, de, fr, it, ja, zh-CN, tr, hi]
      chapter:
        description: sample, all, prologue, chapter number 01–46, or range 01-23 / 24-46
        required: true
        default: sample
        type: string

permissions:
  contents: write

concurrency:
  group: meridian-tgemma-translation-${{ inputs.language }}-${{ inputs.chapter }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore TranslateGemma model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: translategemma-4b-q4km-v1
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 huggingface_hub==0.34.4 beautifulsoup4==4.13.4 diskcache jinja2 typing-extensions
      - name: Install prebuilt llama.cpp CPU wheel
        run: |
          python -m pip install --disable-pip-version-check --no-deps https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.38/llama_cpp_python-0.3.38-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
          python -c "from llama_cpp import Llama; print('llama.cpp CPU runtime ready')"
      - name: Prepare language draft branch
        env:
          TARGET_LANGUAGE: ${{ inputs.language }}
          TARGET_CHAPTER: ${{ inputs.chapter }}
        run: |
          if [[ "$TARGET_CHAPTER" =~ ^[0-9]{2}-[0-9]{2}$ ]]; then
            BRANCH="translation-tgemma-part-$TARGET_CHAPTER/$TARGET_LANGUAGE"
          else
            BRANCH="translation-tgemma-draft/$TARGET_LANGUAGE"
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git checkout -b "$BRANCH"
          fi
          echo "TRANSLATION_BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Generate translation draft
        env:
          HF_HOME: ~/.cache/huggingface
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/translate_meridian_tgemma.py --language "${{ inputs.language }}" --chapter "${{ inputs.chapter }}"
      - name: Push translation draft branch
        env:
          TARGET_LANGUAGE: ${{ inputs.language }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No translated files changed."
            exit 0
          fi
          git commit -m "Draft TranslateGemma translation of THE MERIDIAN OF ASH ($TARGET_LANGUAGE)"
          git push --set-upstream origin "$TRANSLATION_BRANCH"
