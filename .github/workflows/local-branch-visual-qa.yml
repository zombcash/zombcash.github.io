name: Local branch visual QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "index.html"
      - "de/index.html"
      - "fr/index.html"
      - "it/index.html"
      - "ja/index.html"
      - "zh-CN/index.html"
      - "ru/index.html"
      - "tr/index.html"
      - "hi/index.html"
      - "shared-nav.js"
      - "language.js"
      - "homepage-visual.css"
      - "homepage-ribbons.js"
      - "assets/zombcash-survivor-v13.jpg"
      - "docs/DESIGN-STYLE-GUIDE.md"
      - ".github/workflows/homepage-visual-smoke.yml"
      - "tests/mobile-viewport-smoke.cjs"
      - "tests/localized-article-visual.cjs"
      - "tests/survivor-field-manual-smoke.cjs"
      - "tests/memecoin-platforms-article-smoke.cjs"
      - "tests/language-persistence-smoke.cjs"
      - "script.js"
      - "living-world-recovery.js"
      - "tests/living-world-single-loader-smoke.cjs"
      - ".github/workflows/local-branch-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: local-branch-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check shared-nav.js
          node --check language.js
          node --check tests/mobile-viewport-smoke.cjs
          node --check tests/localized-article-visual.cjs
          node --check tests/survivor-field-manual-smoke.cjs
          node --check tests/memecoin-platforms-article-smoke.cjs
          node --check tests/language-persistence-smoke.cjs
          node --check tests/living-world-single-loader-smoke.cjs

      - name: Verify single-loader recovery contract
        run: node tests/living-world-single-loader-smoke.cjs

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local static preview of this branch
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/zombcash-local-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local branch preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zombcash-local-preview.log
          echo "::error::Local branch preview did not start."
          exit 1

      - name: Test homepage across mobile, tablet and desktop widths
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/mobile-viewport-smoke.cjs

      - name: Test localized articles across desktop and mobile
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/localized-article-visual.cjs

      - name: Test Survivor Field Manual across locales and viewports
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/survivor-field-manual-smoke.cjs

      - name: Test multilingual comparison article across locales and viewports
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/memecoin-platforms-article-smoke.cjs

      - name: Test language preference persistence and fallback routing
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/language-persistence-smoke.cjs

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-branch-visual-qa
          path: |
            mobile-test-results/
            localized-article-visual-results/
            survivor-field-manual-results/
            memecoin-article-results/
          if-no-files-found: ignore
          retention-days: 14
