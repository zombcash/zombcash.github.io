name: Local branch visual QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "index.html"
      - "de/index.html"
      - "fr/index.html"
      - "it/index.html"
      - "ja/index.html"
      - "zh-CN/index.html"
      - "ru/index.html"
      - "tr/index.html"
      - "hi/index.html"
      - "shared-nav.js"
      - "tests/shared-nav-accessibility-smoke.cjs"
      - "tests/language-switcher-accessibility-smoke.cjs"
      - "tests/survivor-auth-modal-accessibility-smoke.cjs"
      - "homepage-pre-polish.css"
      - "homepage-components.css"
      - "homepage-late-overrides.css"
      - "tests/homepage-css-seo-smoke.cjs"
      - "tests/homepage-layout-shift-smoke.cjs"
      - "language.js"
      - "homepage-visual.css"
      - "style.css"
      - "tests/homepage-legacy-hero-css-smoke.cjs"
      - "assets/js/zctv-player.js"
      - "tests/zctv-layout-smoke.cjs"
      - "homepage-ribbons.js"
      - "assets/zombcash-survivor-v13.jpg"
      - "docs/DESIGN-STYLE-GUIDE.md"
      - ".github/workflows/homepage-visual-smoke.yml"
      - "tests/mobile-viewport-smoke.cjs"
      - "tests/localized-article-visual.cjs"
      - "tests/survivor-field-manual-smoke.cjs"
      - "tests/buy-zombcash-css-smoke.cjs"
      - "buy-zombcash.html"
      - "*/buy-zombcash.html"
      - "buy-zombcash-main.css"
      - "buy-zombcash-sniper.css"
      - "tests/field-manual-css-smoke.py"
      - "survivor-field-manual-inline.css"
      - "survivor-field-manual-english.css"
      - "survivor-field-manual-translated.css"
      - "tests/memecoin-platforms-article-smoke.cjs"
      - "tests/language-persistence-smoke.cjs"
      - "tests/coingecko-origin-cors-smoke.cjs"
      - "tests/homepage-market-provider-smoke.cjs"
      - "tests/live-api-origin-smoke.cjs"
      - "script.js"
      - "living-world-recovery.js"
      - "survivor-auth.js"
      - "living-world-recovery.js"
      - "tests/frontend-api-timeout-smoke.cjs"
      - "zombie-maker.html"
      - "tests/zombie-maker-api-timeout-smoke.cjs"
      - "tests/zombie-maker-ui-smoke.cjs"
      - "tests/living-world-single-loader-smoke.cjs"
      - ".github/workflows/local-branch-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: local-branch-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check shared-nav.js
          node --check tests/shared-nav-accessibility-smoke.cjs
          node --check tests/survivor-auth-modal-accessibility-smoke.cjs
          node --check tests/homepage-css-seo-smoke.cjs
          node tests/homepage-css-seo-smoke.cjs
          node --check tests/homepage-legacy-hero-css-smoke.cjs
          node tests/homepage-legacy-hero-css-smoke.cjs
          node --check language.js
          node --check survivor-auth.js
          node --check tests/frontend-api-timeout-smoke.cjs
          node tests/frontend-api-timeout-smoke.cjs
          node --check tests/zombie-maker-api-timeout-smoke.cjs
          node tests/zombie-maker-api-timeout-smoke.cjs
          node --check tests/zombie-maker-ui-smoke.cjs
          node --check tests/mobile-viewport-smoke.cjs
          node --check tests/zctv-layout-smoke.cjs
          node --check tests/localized-article-visual.cjs
          node --check tests/survivor-field-manual-smoke.cjs
          node --check tests/buy-zombcash-css-smoke.cjs
          node --check tests/memecoin-platforms-article-smoke.cjs
          node --check tests/language-persistence-smoke.cjs
          node --check tests/live-api-origin-smoke.cjs
          node --check tests/living-world-single-loader-smoke.cjs

      - name: Verify single-loader recovery contract
        run: node tests/living-world-single-loader-smoke.cjs

      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium

      - name: Capture live homepage layout-shift sources before local branch checks
        env:
          SITE_URL: https://zombcash.github.io/
        run: node tests/homepage-layout-shift-smoke.cjs

      - name: Verify CoinGecko browser CORS from the live ZombieCash origin
        run: node tests/coingecko-origin-cors-smoke.cjs

      - name: Verify live ZombieCash API endpoints from the homepage browser origin
        run: node tests/live-api-origin-smoke.cjs

      - name: Start local static preview of this branch
        run: |
          nohup python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/zombcash-local-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo "Local branch preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zombcash-local-preview.log
          echo "::error::Local branch preview did not start."
          exit 1

      - name: Verify local homepage layout shift budget after reserved ribbon initialization
        env:
          SITE_URL: http://127.0.0.1:4173/
          MAX_CLS: "0.25"
        run: node tests/homepage-layout-shift-smoke.cjs

      - name: Test ZombieCash TV three-column, tablet and mobile layout
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/zctv-layout-smoke.cjs

      - name: Test homepage across mobile, tablet and desktop widths
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/mobile-viewport-smoke.cjs

      - name: Test Zombie Lab upload, image generation, caption, sharing and timeout recovery
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/zombie-maker-ui-smoke.cjs

      - name: Test shared navigation keyboard access and ARIA state in all locales
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/shared-nav-accessibility-smoke.cjs

      - name: Test language switcher keyboard access and ARIA state in all locales
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/language-switcher-accessibility-smoke.cjs

      - name: Test Survivor registration modal, login retry, profile save and logout
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/survivor-auth-modal-accessibility-smoke.cjs

      - name: Test localized articles across desktop and mobile
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/localized-article-visual.cjs

      - name: Test Survivor Field Manual across locales and viewports
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/survivor-field-manual-smoke.cjs

      - name: Test Buy ZombieCash page CSS and responsive layout in all locales
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/buy-zombcash-css-smoke.cjs

      - name: Verify field manual CSS extraction
        run: python tests/field-manual-css-smoke.py

      - name: Test multilingual comparison article across locales and viewports
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/memecoin-platforms-article-smoke.cjs

      - name: Test language preference persistence and fallback routing
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/language-persistence-smoke.cjs

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-branch-visual-qa
          path: |
            mobile-test-results/
            zctv-layout-results/
            localized-article-visual-results/
            survivor-field-manual-results/
            memecoin-article-results/
          if-no-files-found: ignore
          retention-days: 14
