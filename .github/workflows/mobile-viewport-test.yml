name: Mobile viewport smoke test
# Re-run responsive QA after homepage layout or sponsor-slot geometry changes.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'language.js'
      - 'shared-nav.js'
      - 'cinematic-theme.css'
      - 'tests/language-transition-smoke.cjs'
      - 'tests/whitepaper-localization-visual-smoke.cjs'
      - 'whitepaper.html'
      - '**/whitepaper.html'
      - 'tests/shared-nav-accessibility-smoke.cjs'
      - 'tests/homepage-css-seo-smoke.cjs'
      - 'tests/homepage-locales-layout-smoke.cjs'
      - 'tests/homepage-zoom-layout-smoke.cjs'
      - 'de/index.html'
      - 'fr/index.html'
      - 'it/index.html'
      - 'ja/index.html'
      - 'zh-CN/index.html'
      - 'ru/index.html'
      - 'tr/index.html'
      - 'hi/index.html'
      - 'assets/images/zombcash-tv-raven.png'
      - 'assets/zombcash-lab-survivor.webp'
      - 'tests/homepage-zoom-layout-smoke.cjs'
      - 'survivor-field-manual.html'
      - 'survivor-hub.html'
      - '**/survivor-hub.html'
      - 'tests/survivor-hub-localization-smoke.cjs'
      - 'tests/survivor-hub-visual-smoke.cjs'
      - 'tests/survivor-auth-modal-accessibility-smoke.cjs'
      - 'arcade.html'
      - 'ai-arena.js'
      - 'zombie-world.js'
      - 'tests/arcade-ai-worlds-visual-smoke.cjs'
      - 'tests/arcade-dynamic-localization-smoke.cjs'
      - 'tests/arcade-snake-iframe-smoke.cjs'
      - 'tests/arcade-snake-session-save-smoke.cjs'
      - 'script.js'
      - 'survivor-auth.js'
      - 'living-world-recovery.js'
      - 'tests/frontend-api-timeout-smoke.cjs'
      - 'ai-model-status.js'
      - 'tests/arcade-snake-iframe-smoke.cjs'
      - 'tests/arcade-snake-session-save-smoke.cjs'
      - 'script.js'
      - 'survivor-auth.js'
      - 'living-world-recovery.js'
      - 'tests/frontend-api-timeout-smoke.cjs'
      - 'index.html'
      - '.github/workflows/mobile-viewport-test.yml'
  push:
    branches: [main]
    paths:
      - 'shared-nav.js'
      - 'cinematic-theme.css'
      - 'language.js'
      - 'tests/language-transition-smoke.cjs'
      - 'index.html'
      - 'homepage-visual.css'
      - 'tests/homepage-locales-layout-smoke.cjs'
      - 'tests/homepage-zoom-layout-smoke.cjs'
      - 'de/index.html'
      - 'fr/index.html'
      - 'it/index.html'
      - 'ja/index.html'
      - 'zh-CN/index.html'
      - 'ru/index.html'
      - 'tr/index.html'
      - 'hi/index.html'
      - 'arcade.html'
      - 'ai-arena.js'
      - 'zombie-world.js'
      - 'tests/arcade-ai-worlds-visual-smoke.cjs'
      - '.github/workflows/mobile-viewport-test.yml'
      - 'tests/mobile-viewport-smoke.cjs'
      - 'tests/whitepaper-localization-visual-smoke.cjs'
      - 'whitepaper.html'
      - '**/whitepaper.html'
      - 'tests/survivor-field-manual-smoke.cjs'
      - 'survivor-hub.html'
      - '**/survivor-hub.html'
      - 'tests/survivor-hub-localization-smoke.cjs'
      - 'tests/survivor-hub-visual-smoke.cjs'
      - 'tests/survivor-auth-modal-accessibility-smoke.cjs'
      - 'tests/arcade-dynamic-localization-smoke.cjs'
      - 'tests/memecoin-platforms-article-smoke.cjs'
      - 'memecoin-promotion-platforms-comparison.html'
      - 'de/memecoin-promotion-platforms-comparison.html'
      - 'fr/memecoin-promotion-platforms-comparison.html'
      - 'it/memecoin-promotion-platforms-comparison.html'
      - 'ja/memecoin-promotion-platforms-comparison.html'
      - 'zh-CN/memecoin-promotion-platforms-comparison.html'
      - 'ru/memecoin-promotion-platforms-comparison.html'
      - 'tr/memecoin-promotion-platforms-comparison.html'
      - 'hi/memecoin-promotion-platforms-comparison.html'
      - 'images/memecoin-platforms-battlefield.svg'
      - 'survivor-field-manual.html'
      - 'ru/survivor-field-manual.html'
      - 'de/survivor-field-manual.html'
      - 'fr/survivor-field-manual.html'
      - 'it/survivor-field-manual.html'
      - 'ja/survivor-field-manual.html'
      - 'zh-CN/survivor-field-manual.html'
      - 'tr/survivor-field-manual.html'
      - 'hi/survivor-field-manual.html'

permissions:
  contents: read

# Run validation to completion. Batch related edits into one commit instead of
# turning valid checks into red cancelled results during rapid pushes.
concurrency:
  group: mobile-viewport-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://127.0.0.1:4173/
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Validate homepage, Hub and Arcade smoke-test JavaScript syntax
        run: |
          node --check assets/js/zctv-player.js
          node --check ai-model-status.js
          node --check shared-nav.js
          node --check tests/shared-nav-accessibility-smoke.cjs
          node --check tests/homepage-css-seo-smoke.cjs
          node tests/homepage-css-seo-smoke.cjs
          node --check tests/survivor-hub-localization-smoke.cjs
          node --check tests/survivor-hub-visual-smoke.cjs
          node --check tests/survivor-auth-modal-accessibility-smoke.cjs
          node --check tests/arcade-dynamic-localization-smoke.cjs
          node --check tests/frontend-api-timeout-smoke.cjs
          node tests/frontend-api-timeout-smoke.cjs
          node --check tests/arcade-snake-iframe-smoke.cjs
          node --check tests/arcade-snake-session-save-smoke.cjs
          node --check tests/arcade-ai-worlds-visual-smoke.cjs
      - name: Test price-history selected-window and stale-data warning
        run: node tests/price-history-stale-window-smoke.cjs

      - name: Serve checked-out site for deterministic browser QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zombcash-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zombcash-preview.log
          exit 1
      - name: Test mobile layouts against current checkout
        run: node tests/mobile-viewport-smoke.cjs
      - name: Test language switching after page transitions
        run: node tests/language-transition-smoke.cjs
      - name: Browser-check all Whitepaper locales on desktop and mobile; test 16 language transitions
        run: node tests/whitepaper-localization-visual-smoke.cjs
      - name: Upload Whitepaper browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-localization-browser-evidence
          path: whitepaper-localization-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test shared navigation keyboard access and ARIA state in all locales
        run: node tests/shared-nav-accessibility-smoke.cjs
      - name: Test Telegram login modal focus, retry and profile-save behavior
        run: node tests/survivor-auth-modal-accessibility-smoke.cjs
      - name: Test homepage layout across all locales and viewports
        if: always()
        run: node tests/homepage-locales-layout-smoke.cjs
      - name: Test homepage at reduced browser zoom viewports
        if: always()
        run: node tests/homepage-zoom-layout-smoke.cjs
      - name: Test ZombieCash TV player, archive and responsive columns
        if: always()
        run: node tests/zctv-layout-smoke.cjs
      - name: Test Survivor Field Manual across locales and viewports
        if: always()
        run: node tests/survivor-field-manual-smoke.cjs
      - name: Test multilingual comparison article visually across locales and viewports
        if: always()
        run: node tests/memecoin-platforms-article-smoke.cjs

      - name: Test Survivor Hub translations in all supported locales
        if: always()
        run: node tests/survivor-hub-localization-smoke.cjs

      - name: Browser-check Survivor Hub navigation and layout across locales and viewports
        if: always()
        run: node tests/survivor-hub-visual-smoke.cjs

      - name: Test Arcade dynamic records, save statuses and progress in all locales
        if: always()
        run: node tests/arcade-dynamic-localization-smoke.cjs

      - name: Test Snake iframe loading, start bridge and keyboard bridge
        if: always()
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/arcade-snake-iframe-smoke.cjs

      - name: Test Snake full game-over and Survivor profile save handshake
        if: always()
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node tests/arcade-snake-session-save-smoke.cjs

      - name: Upload Snake iframe and session-save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-iframe-session-save-evidence
          path: |
            arcade-snake-iframe-results/
            arcade-snake-session-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test AI Worlds on the actual Arcade page and capture screenshot
        if: always()
        run: node tests/arcade-ai-worlds-visual-smoke.cjs

      - name: Upload wide viewport visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-zoom-visual-evidence
          path: homepage-zoom-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AI Worlds Arcade screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-worlds-arcade-screenshot
          path: ai-worlds-visual-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Survivor Hub visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivor-hub-visual-evidence
          path: survivor-hub-visual-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-viewport-evidence
          path: |
            mobile-test-results/
            homepage-locale-results/
            homepage-zoom-results/
            zctv-layout-results/
            survivor-field-manual-results/
            memecoin-article-results/
            survivor-hub-visual-results/
            arcade-snake-iframe-results/
            arcade-snake-session-results/
          if-no-files-found: ignore
          retention-days: 14
