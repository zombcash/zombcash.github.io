name: Mobile viewport smoke test
# Re-run responsive QA after homepage layout or sponsor-slot geometry changes.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'language.js'
      - 'shared-nav.js'
      - 'tests/language-transition-smoke.cjs'
      - 'tests/homepage-locales-layout-smoke.cjs'
      - 'tests/homepage-zoom-layout-smoke.cjs'
      - 'survivor-field-manual.html'
      - 'survivor-hub.html'
      - 'tests/survivor-hub-localization-smoke.cjs'
      - '.github/workflows/mobile-viewport-test.yml'
  push:
    branches: [main]
    paths:
      - 'shared-nav.js'
      - 'language.js'
      - 'tests/language-transition-smoke.cjs'
      - 'index.html'
      - 'homepage-visual.css'
      - 'tests/homepage-locales-layout-smoke.cjs'
      - 'tests/homepage-zoom-layout-smoke.cjs'
      - 'de/index.html'
      - 'fr/index.html'
      - 'it/index.html'
      - 'ja/index.html'
      - 'zh-CN/index.html'
      - 'ru/index.html'
      - 'tr/index.html'
      - 'hi/index.html'
      - 'arcade.html'
      - '.github/workflows/mobile-viewport-test.yml'
      - 'tests/mobile-viewport-smoke.cjs'
      - 'tests/survivor-field-manual-smoke.cjs'
      - 'survivor-hub.html'
      - 'tests/survivor-hub-localization-smoke.cjs'
      - 'tests/memecoin-platforms-article-smoke.cjs'
      - 'memecoin-promotion-platforms-comparison.html'
      - 'de/memecoin-promotion-platforms-comparison.html'
      - 'fr/memecoin-promotion-platforms-comparison.html'
      - 'it/memecoin-promotion-platforms-comparison.html'
      - 'ja/memecoin-promotion-platforms-comparison.html'
      - 'zh-CN/memecoin-promotion-platforms-comparison.html'
      - 'ru/memecoin-promotion-platforms-comparison.html'
      - 'tr/memecoin-promotion-platforms-comparison.html'
      - 'hi/memecoin-promotion-platforms-comparison.html'
      - 'images/memecoin-platforms-battlefield.svg'
      - 'survivor-field-manual.html'
      - 'ru/survivor-field-manual.html'
      - 'de/survivor-field-manual.html'
      - 'fr/survivor-field-manual.html'
      - 'it/survivor-field-manual.html'
      - 'ja/survivor-field-manual.html'
      - 'zh-CN/survivor-field-manual.html'
      - 'tr/survivor-field-manual.html'
      - 'hi/survivor-field-manual.html'

permissions:
  contents: read

# Run validation to completion. Batch related edits into one commit instead of
# turning valid checks into red cancelled results during rapid pushes.
concurrency:
  group: mobile-viewport-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    env:
      SITE_URL: http://127.0.0.1:4173/
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate homepage player JavaScript syntax
        run: node --check assets/js/zctv-player.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Serve checked-out site for deterministic browser QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zombcash-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zombcash-preview.log
          exit 1
      - name: Test mobile layouts against current checkout
        run: node tests/mobile-viewport-smoke.cjs
      - name: Test language switching after page transitions
        run: node tests/language-transition-smoke.cjs
      - name: Test homepage layout across all locales and viewports
        if: always()
        run: node tests/homepage-locales-layout-smoke.cjs
      - name: Test homepage at reduced browser zoom viewports
        if: always()
        run: node tests/homepage-zoom-layout-smoke.cjs
      - name: Test ZombieCash TV player, archive and responsive columns
        if: always()
        run: node tests/zctv-layout-smoke.cjs
      - name: Test Survivor Field Manual across locales and viewports
        if: always()
        run: node tests/survivor-field-manual-smoke.cjs
      - name: Test multilingual comparison article visually across locales and viewports
        if: always()
        run: node tests/memecoin-platforms-article-smoke.cjs

      - name: Test Survivor Hub translations in all supported locales
        if: always()
        run: node tests/survivor-hub-localization-smoke.cjs

      - name: Upload wide viewport visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-zoom-visual-evidence
          path: homepage-zoom-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-viewport-evidence
          path: |
            mobile-test-results/
            homepage-locale-results/
            homepage-zoom-results/
            zctv-layout-results/
            survivor-field-manual-results/
            memecoin-article-results/
          if-no-files-found: ignore
          retention-days: 14
