name: SEO metadata smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "tests/seo-metadata-audit.cjs"
      - ".github/workflows/seo-metadata-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "tests/seo-metadata-audit.cjs"
      - ".github/workflows/seo-metadata-audit.yml"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate canonical, hreflang and Open Graph metadata
        run: node tests/seo-metadata-audit.cjs
