name: Generate search-compatible favicons

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "zombcash-hand-logo.svg"
      - ".github/workflows/generate-favicons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image converters
        run: python -m pip install --upgrade pillow cairosvg
      - name: Generate PNG and ICO variants from the existing brand logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import cairosvg
          from PIL import Image

          source = Path("zombcash-hand-logo.svg").read_bytes()
          for size, filename in [(192, "icon-192.png"), (512, "icon-512.png"), (180, "apple-touch-icon.png"), (96, "favicon-96.png")]:
              png = cairosvg.svg2png(bytestring=source, output_width=size, output_height=size)
              Path(filename).write_bytes(png)

          png256 = cairosvg.svg2png(bytestring=source, output_width=256, output_height=256)
          with Image.open(io.BytesIO(png256)) as image:
              image.convert("RGBA").save("favicon.ico", format="ICO", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          PY
      - name: Commit generated icons if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon.ico favicon-96.png icon-192.png icon-512.png apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Build PNG and ICO favicons from ZombieCash logo"
            git push
          else
            echo "Favicon files already up to date."
          fi
