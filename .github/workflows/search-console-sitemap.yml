name: Search Console Sitemap Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sitemap.xml"
      - "sitemap-*.xml"
      - "robots.txt"
      - "*.html"
      - "ru/**"
      - "de/**"
      - "fr/**"
      - "it/**"
      - "ja/**"
      - "zh-CN/**"
      - "tr/**"
      - "hi/**"
      - ".github/workflows/search-console-sitemap.yml"

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install HTTP and Google API clients
        run: python -m pip install --disable-pip-version-check requests google-api-python-client google-auth

      - name: Validate every sitemap listed in robots.txt
        run: |
          python - <<'PY'
          import requests
          import xml.etree.ElementTree as ET

          site_url = "https://zombcash.github.io/"
          robots_url = site_url + "robots.txt"
          response = requests.get(robots_url, timeout=30)
          print(f"robots.txt HTTP: {response.status_code}")
          response.raise_for_status()

          sitemap_urls = [
              line.split(":", 1)[1].strip()
              for line in response.text.splitlines()
              if line.lower().startswith("sitemap:")
          ]
          main_sitemap = site_url + "sitemap.xml"
          sitemap_urls = [main_sitemap] + [url for url in sitemap_urls if url != main_sitemap]
          sitemap_urls = list(dict.fromkeys(sitemap_urls))
          if len(sitemap_urls) < 1:
              raise SystemExit("ERROR: robots.txt contains no sitemap URLs.")

          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          all_pages = set()
          for sitemap_url in sitemap_urls:
              sitemap_response = requests.get(sitemap_url, timeout=30)
              print(f"Sitemap HTTP {sitemap_response.status_code}: {sitemap_url}")
              sitemap_response.raise_for_status()
              root = ET.fromstring(sitemap_response.content)
              if root.tag.endswith("urlset"):
                  page_urls = [
                      (node.text or "").strip()
                      for node in root.findall("sm:url/sm:loc", ns)
                      if (node.text or "").strip()
                  ]
              elif root.tag.endswith("sitemapindex"):
                  page_urls = [
                      (node.text or "").strip()
                      for node in root.findall("sm:sitemap/sm:loc", ns)
                      if (node.text or "").strip()
                  ]
              else:
                  raise SystemExit(f"ERROR: Unexpected XML root in {sitemap_url}: {root.tag}")
              if not page_urls:
                  raise SystemExit(f"ERROR: No URL entries found in {sitemap_url}.")
              if any(not url.startswith(site_url) for url in page_urls):
                  raise SystemExit(f"ERROR: {sitemap_url} contains a URL outside {site_url}.")
              all_pages.update(page_urls)
              print(f"Entries: {len(page_urls)}")
          print(f"Total unique page URLs across all sitemaps: {len(all_pages)}")
          PY

      - name: Submit every robots.txt sitemap through Search Console API
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import requests
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          site_url = "https://zombcash.github.io/"
          robots_url = site_url + "robots.txt"
          raw_credentials = os.environ.get("GSC_SERVICE_ACCOUNT_JSON", "")
          if not raw_credentials.strip():
              raise SystemExit("ERROR: GitHub Secret GSC_SERVICE_ACCOUNT_JSON is missing or empty.")

          response = requests.get(robots_url, timeout=30)
          response.raise_for_status()
          sitemap_urls = [
              line.split(":", 1)[1].strip()
              for line in response.text.splitlines()
              if line.lower().startswith("sitemap:")
          ]
          main_sitemap = site_url + "sitemap.xml"
          sitemap_urls = [main_sitemap] + [url for url in sitemap_urls if url != main_sitemap]
          sitemap_urls = list(dict.fromkeys(sitemap_urls))

          try:
              info = json.loads(raw_credentials)
              credentials = service_account.Credentials.from_service_account_info(
                  info, scopes=["https://www.googleapis.com/auth/webmasters"]
              )
              service = build("searchconsole", "v1", credentials=credentials, cache_discovery=False)
          except Exception as exc:
              raise SystemExit(f"ERROR: Could not initialize Search Console client: {type(exc).__name__}: {exc}")

          print(f"Service account: {info.get('client_email', '(email not found)')}")
          print(f"Search Console property: {site_url}")
          before = service.sitemaps().list(siteUrl=site_url).execute()
          existing = {item.get("path"): item for item in before.get("sitemap", [])}

          for sitemap_url in sitemap_urls:
              try:
                  service.sitemaps().submit(siteUrl=site_url, feedpath=sitemap_url).execute()
                  print(f"SUBMIT ACCEPTED: {sitemap_url}")
              except HttpError as exc:
                  print(f"ERROR submitting {sitemap_url}: HTTP {exc.resp.status}")
                  print(exc.content.decode("utf-8", errors="replace")[:2000])
                  raise

          after = service.sitemaps().list(siteUrl=site_url).execute()
          entries = {item.get("path"): item for item in after.get("sitemap", [])}
          for sitemap_url in sitemap_urls:
              item = entries.get(sitemap_url)
              if not item:
                  print(f"WARNING: No immediate Search Console entry returned for {sitemap_url}")
                  continue
              print(f"SITEMAP STATUS: {sitemap_url}")
              for key in ("lastSubmitted", "lastDownloaded", "isPending", "type", "warnings", "errors"):
                  if key in item:
                      print(f"  {key}: {item[key]}")
          print("Search Console accepted the sitemap submission requests. Processing and indexing are not implied.")
          PY
