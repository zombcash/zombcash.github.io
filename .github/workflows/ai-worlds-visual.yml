name: AI Worlds Actual Arcade Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'arcade.html'
      - 'ai-arena.js'
      - 'zombie-world.js'
      - 'tests/arcade-ai-worlds-visual-smoke.cjs'
      - '.github/workflows/ai-worlds-visual.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'arcade.html'
      - 'ai-arena.js'
      - 'zombie-world.js'
      - 'tests/arcade-ai-worlds-visual-smoke.cjs'
      - '.github/workflows/ai-worlds-visual.yml'

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: http://127.0.0.1:4173/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve current Arcade build
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/zombcash-arcade-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/arcade.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zombcash-arcade-preview.log
          exit 1
      - name: Verify actual Arcade AI Worlds and capture screenshot
        run: node tests/arcade-ai-worlds-visual-smoke.cjs
      - name: Upload Arcade AI Worlds screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-worlds-arcade-screenshot
          path: ai-worlds-visual-results/
          if-no-files-found: ignore
          retention-days: 14
