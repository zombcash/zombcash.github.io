name: Localized article visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localized-article-visual.yml'
      - 'tests/localized-article-visual.cjs'
      - 'buy-zombcash.html'
      - '*/buy-zombcash.html'
      - 'transmission-zombie-fiction-rpg-guide.html'
      - '*/transmission-zombie-fiction-rpg-guide.html'
      - 'transmission-last-backup-ai-apocalypse.html'
      - '*/transmission-last-backup-ai-apocalypse.html'
      - 'shared-nav.js'
      - 'language.js'

permissions:
  contents: read

concurrency:
  group: localized-article-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test 27 live article pages on desktop and mobile
        run: node tests/localized-article-visual.cjs
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localized-article-visual-evidence
          path: localized-article-visual-results/
          if-no-files-found: ignore
          retention-days: 14
