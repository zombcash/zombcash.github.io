name: Homepage visual refresh smoke checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'de/index.html'
      - 'fr/index.html'
      - 'it/index.html'
      - 'ja/index.html'
      - 'zh-CN/index.html'
      - 'ru/index.html'
      - 'tr/index.html'
      - 'hi/index.html'
      - 'homepage-visual.css'
      - 'ai-model-status.js'
      - 'tests/homepage-css-seo-smoke.cjs'
      - 'tests/homepage-market-provider-smoke.cjs'
      - 'tests/homepage-translated-css-smoke.py'
      - 'tests/inline-style-audit.py'
      - 'homepage-translated-hero.css'
      - 'homepage-translated-components.css'
      - 'homepage-de-field-manual.css'
      - 'homepage-ribbons.js'
      - 'assets/js/zctv-player.js'
      - 'assets/zombcash-survivor-realistic-520.avif'
      - 'docs/DESIGN-STYLE-GUIDE.md'
      - '.github/workflows/homepage-visual-smoke.yml'

permissions:
  contents: read

jobs:
  homepage-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ticker script syntax
        run: node --check homepage-ribbons.js
      - name: Test ZOMBCASH ticker GeckoTerminal fallback
        run: node tests/homepage-market-provider-smoke.cjs

      - name: Test CoinGecko-only browser provider, rate-limit handling and unavailable state
        run: node tests/homepage-market-provider-smoke.cjs
      - name: Verify all localized homepages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = {
              "index.html": "en",
              "de/index.html": "de",
              "fr/index.html": "fr",
              "it/index.html": "it",
              "ja/index.html": "ja",
              "zh-CN/index.html": "zh-CN",
              "ru/index.html": "ru",
              "tr/index.html": "tr",
              "hi/index.html": "hi",
          }
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'id="zombcash-promo-video-library-script"' not in html, "legacy inline promo loader must not compete with the TV player"
          assert "fetch('promo-videos.json?v=20261105-i18n1'" not in html, "duplicate inline promo manifest request remains"
          assert 'src="/assets/js/zctv-player.js?v=20261125-tv-lazy-1"' in html, "authoritative ZombieCash TV player script missing"
          tv_script = Path("assets/js/zctv-player.js").read_text(encoding="utf-8")
          assert "fetch('/promo-videos.json?v=20261110-tv-library'" in tv_script, "TV player must own promo manifest loading"
          assert "function showFeaturedPromo()" in tv_script, "TV player must own featured promo rendering"
          print("OK promo video library has one authoritative TV player loader")
          expected_ribbons = {name: "20261126-ticker-parity-4" for name in pages}
          for filename, lang in pages.items():
              html = Path(filename).read_text(encoding="utf-8")
              assert f'<html lang="{lang}">' in html, f"{filename}: wrong language tag"
              assert html.count('href="/homepage-visual.css?') == 1, f"{filename}: stylesheet missing or duplicated"
              assert html.count(f'src="/homepage-ribbons.js?v={expected_ribbons[filename]}"') == 1, f"{filename}: ticker script missing or duplicated"
              assert html.count('rel="canonical"') == 1, f"{filename}: canonical count changed"
              assert html.count('hreflang=') == 10, f"{filename}: hreflang count changed"
              assert '<main id="home">' in html, f"{filename}: homepage main element missing"
              assert 'class="zc-hero-art-panel' in html, f"{filename}: project-owned hero artwork panel missing"
              assert ('zc-novel-cover' in html or '/assets/zombcash-survivor-realistic-520.avif' in html), f"{filename}: project-owned hero artwork missing"
              if 'zc-novel-cover' in html:
                  assert ('alt="The Meridian of Ash — Book I cover"' in html if lang == "en" else 'alt="The Meridian of Ash —' in html), f"{filename}: localized novel-cover alt text missing"
              else:
                  assert '<img src="/assets/zombcash-survivor-realistic-520.avif" alt="ZombieCash zombie survivor heroine"' in html, f"{filename}: accessible survivor artwork image missing"
              assert 'IMAGE SLOT' not in html and 'МЕСТО ДЛЯ ИЗОБРАЖЕНИЯ' not in html and 'Bildfeld' not in html, f"{filename}: unfinished hero artwork placeholder remains"
              print(f"OK {filename} ({lang})")
          PY

      - name: Verify translated homepage CSS consolidation and site-wide inline CSS inventory
        run: |
          python tests/homepage-translated-css-smoke.py
          python tests/inline-style-audit.py

      - name: Verify project-owned artwork and accessibility hooks
        run: |
          test -s assets/zombcash-survivor-realistic-520.avif
          grep -q "setAttribute('role','region')" homepage-ribbons.js
          grep -q "setAttribute('aria-hidden','true')" homepage-ribbons.js
          grep -q 'prefers-reduced-motion' homepage-visual.css
          python - <<'PY'
          from pathlib import Path
          css = Path('homepage-visual.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'homepage-visual.css has unbalanced braces'
          print('OK artwork asset, localized hero slots, ticker accessibility, reduced motion and CSS structure')
          PY

      - name: Verify published full-bleed banner assets
        run: |
          python -m pip install --quiet requests Pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import requests
          import re
          from urllib.parse import urljoin
          from PIL import Image
          base = "https://zombcash.github.io"
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          class StylesheetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "link":
                      return
                  values = dict(attrs)
                  if "stylesheet" in values.get("rel", "").lower().split():
                      href = values.get("href", "")
                      if "/homepage-visual.css?" in href:
                          self.hrefs.append(href)

          base = "https://zombcash.github.io"
          pages = ["index.html", "de/index.html", "fr/index.html", "it/index.html", "ja/index.html", "zh-CN/index.html", "tr/index.html", "hi/index.html", "ru/index.html"]
          css_urls = set()
          for page in pages:
              response = requests.get(f"{base}/{page}?banner-check=homepage-current", timeout=30)
              response.raise_for_status()
              parser = StylesheetParser()
              parser.feed(response.text)
              assert len(parser.hrefs) == 1, f"{page}: homepage visual stylesheet missing or duplicated"
              css_urls.add(urljoin(base + "/", parser.hrefs[0]))
          assert len(css_urls) == 1, f"Homepage locales do not share one stylesheet: {sorted(css_urls)}"
          css_url = next(iter(css_urls))
          version = css_url.split("?v=", 1)[1] if "?v=" in css_url else ""
          assert version, f"Missing homepage CSS cache version in {css_url}"
          css = requests.get(css_url, timeout=30)
          css.raise_for_status()
          version = css_url.split("?v=", 1)[1] if "?v=" in css_url else ""
          assert version, f"Missing homepage CSS cache version in {css_url}"
          assert "FULL-BLEED TOOL BANNERS" in css.text
          for filename in ["meme-radar.jpg", "zombie-lab.jpg", "survivor-network.jpg"]:
              response = requests.get(f"{base}/assets/tools/{filename}?v={version}", timeout=30)
              response.raise_for_status()
              assert response.headers.get("Content-Type", "").startswith("image/jpeg"), f"{filename}: wrong content type"
              image = Image.open(BytesIO(response.content))
              assert image.size == (1600, 640), f"{filename}: unexpected dimensions {image.size}"
              print(f"OK {filename}: HTTP {response.status_code}, {image.size}, {len(response.content)} bytes")
          print("OK all 9 locale homepages, full-bleed stylesheet, and all 3 published banners")
          PY

      - name: Verify live localized tool video panels and hover behavior
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          base = "https://zombcash.github.io"
          pages = {
              "index.html": "en", "de/index.html": "de", "fr/index.html": "fr",
              "it/index.html": "it", "ja/index.html": "ja", "zh-CN/index.html": "zh-CN",
              "tr/index.html": "tr", "hi/index.html": "hi", "ru/index.html": "ru"
          }
          class StylesheetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag.lower() == "link" and "stylesheet" in values.get("rel", "").lower().split():
                      href = values.get("href", "")
                      if "/homepage-visual.css?" in href:
                          self.hrefs.append(href)
          version = None
          for path, lang in pages.items():
              r = requests.get(f"{base}/{path}?video-audit=homepage-current", timeout=30)
              r.raise_for_status()
              html = r.text
              assert f'<html lang="{lang}">' in html, f"{path}: wrong/missing lang"
              assert html.count('class="tool-art tool-video-shell') == 3, f"{path}: expected 3 video panels"
              assert html.count('class="tool-card-video"') == 3, f"{path}: expected 3 video elements"
              assert html.count('data-video-card=') == 3, f"{path}: expected 3 video controllers"
              assert 'tool-video-cards.js?v=20261109-2' in html, f"{path}: video controller missing"
              parser = StylesheetParser()
              parser.feed(html)
              assert len(parser.hrefs) == 1, f"{path}: homepage stylesheet missing or duplicated"
              css_version = parser.hrefs[0].split("?v=", 1)[1] if "?v=" in parser.hrefs[0] else ""
              assert css_version, f"{path}: homepage stylesheet version missing"
              if version is None:
                  version = css_version
              else:
                  assert version == css_version, f"{path}: homepage CSS version differs"
              print(f"OK {path} [{lang}]: 3 video panels + controller + current CSS")
          js = requests.get(f"{base}/tool-video-cards.js?v=20261109-2", timeout=30)
          js.raise_for_status()
          for hook in ["pointerenter", "pointerleave", "play(card,false)", "pause(card)", "prefers-reduced-motion"]:
              assert hook in js.text, f"video controller missing {hook}"
          print("OK live video controller: hover-to-play, leave-to-pause, click/tap, reduced-motion guard")
          css = requests.get(f"{base}/homepage-visual.css?v={version}", timeout=30)
          css.raise_for_status()
          text = css.text
          assert "HOTFIX 2026-11-10 — restore the original live video windows" in text
          assert "display:block!important" in text[text.index("HOTFIX 2026-11-10 — restore the original live video windows"):]
          assert "grid-area:video!important" in text[text.index("HOTFIX 2026-11-10 — restore the original live video windows"):]
          for name in ["meme-radar.jpg", "zombie-lab.jpg", "survivor-network.jpg"]:
              r = requests.get(f"{base}/assets/tools/{name}?v={version}", timeout=30)
              r.raise_for_status()
              assert r.headers.get("Content-Type", "").startswith("image/jpeg"), f"{name}: bad content type"
              print(f"OK live background {name}: {len(r.content)} bytes")
          print("PASS: all 9 localized pages, all 3 live video panels, hover controller and 3 backgrounds")
          PY
