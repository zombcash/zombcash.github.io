name: Homepage visual refresh smoke checks

on:
  push:
    branches: [homepage-visual-refinements-2026-11]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'de/index.html'
      - 'fr/index.html'
      - 'it/index.html'
      - 'ja/index.html'
      - 'zh-CN/index.html'
      - 'ru/index.html'
      - 'tr/index.html'
      - 'hi/index.html'
      - 'homepage-visual.css'
      - 'homepage-ribbons.js'
      - 'assets/zombcash-survivor-v13.jpg'
      - 'docs/DESIGN-STYLE-GUIDE.md'
      - '.github/workflows/homepage-visual-smoke.yml'

permissions:
  contents: read

jobs:
  homepage-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ticker script syntax
        run: node --check homepage-ribbons.js
      - name: Verify all localized homepages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = {
              "index.html": "en",
              "de/index.html": "de",
              "fr/index.html": "fr",
              "it/index.html": "it",
              "ja/index.html": "ja",
              "zh-CN/index.html": "zh-CN",
              "ru/index.html": "ru",
              "tr/index.html": "tr",
              "hi/index.html": "hi",
          }
          for filename, lang in pages.items():
              html = Path(filename).read_text(encoding="utf-8")
              assert f'<html lang="{lang}">' in html, f"{filename}: wrong language tag"
              assert html.count('href="/homepage-visual.css?v=20261105"') == 1, f"{filename}: stylesheet missing or duplicated"
              assert html.count('src="/homepage-ribbons.js?v=20261105"') == 1, f"{filename}: ticker script missing or duplicated"
              assert html.count('rel="canonical"') == 1, f"{filename}: canonical count changed"
              assert html.count('hreflang=') == 10, f"{filename}: hreflang count changed"
              assert '<main id="home">' in html, f"{filename}: homepage main element missing"
              if filename == "index.html":
                  assert '/assets/zombcash-survivor-v13.jpg' in html, "project-owned survivor artwork missing"
                  assert 'TACTICAL VISUAL / IMAGE SLOT' not in html, "unfinished hero art placeholder remains"
              print(f"OK {filename} ({lang})")
          PY

      - name: Verify project-owned artwork and accessibility hooks
        run: |
          test -s assets/zombcash-survivor-v13.jpg
          grep -q 'aria-hidden.*true' homepage-ribbons.js
          grep -q 'prefers-reduced-motion' homepage-visual.css
          python - <<'PY'
          from pathlib import Path
          css = Path('homepage-visual.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'homepage-visual.css has unbalanced braces'
          print('OK artwork asset, ticker accessibility, reduced motion and CSS structure')
          PY
