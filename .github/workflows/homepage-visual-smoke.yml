name: Homepage visual refresh smoke checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'de/index.html'
      - 'fr/index.html'
      - 'it/index.html'
      - 'ja/index.html'
      - 'zh-CN/index.html'
      - 'ru/index.html'
      - 'tr/index.html'
      - 'hi/index.html'
      - 'homepage-visual.css'
      - 'homepage-ribbons.js'
      - 'assets/zombcash-survivor-realistic-520.avif'
      - 'docs/DESIGN-STYLE-GUIDE.md'
      - '.github/workflows/homepage-visual-smoke.yml'

permissions:
  contents: read

jobs:
  homepage-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check ticker script syntax
        run: node --check homepage-ribbons.js
      - name: Verify all localized homepages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = {
              "index.html": "en",
              "de/index.html": "de",
              "fr/index.html": "fr",
              "it/index.html": "it",
              "ja/index.html": "ja",
              "zh-CN/index.html": "zh-CN",
              "ru/index.html": "ru",
              "tr/index.html": "tr",
              "hi/index.html": "hi",
          }
          for filename, lang in pages.items():
              html = Path(filename).read_text(encoding="utf-8")
              assert f'<html lang="{lang}">' in html, f"{filename}: wrong language tag"
              assert html.count('href="/homepage-visual.css?') == 1, f"{filename}: stylesheet missing or duplicated"
              assert html.count('src="/homepage-ribbons.js?v=20261105"') == 1, f"{filename}: ticker script missing or duplicated"
              assert html.count('rel="canonical"') == 1, f"{filename}: canonical count changed"
              assert html.count('hreflang=') == 10, f"{filename}: hreflang count changed"
              assert '<main id="home">' in html, f"{filename}: homepage main element missing"
              assert 'class="zc-sponsor-art-slot"' in html, f"{filename}: survivor artwork panel missing"
              assert '/assets/zombcash-survivor-realistic-520.avif' in html, f"{filename}: project-owned survivor artwork missing"
              assert '<img src="/assets/zombcash-survivor-realistic-520.avif" alt="ZombieCash zombie survivor heroine"' in html, f"{filename}: accessible survivor artwork image missing"
              assert 'IMAGE SLOT' not in html and 'МЕСТО ДЛЯ ИЗОБРАЖЕНИЯ' not in html and 'Bildfeld' not in html, f"{filename}: unfinished hero artwork placeholder remains"
              print(f"OK {filename} ({lang})")
          PY

      - name: Verify project-owned artwork and accessibility hooks
        run: |
          test -s assets/zombcash-survivor-realistic-520.avif
          grep -q "setAttribute('role','region')" homepage-ribbons.js
          grep -q "setAttribute('aria-hidden','true')" homepage-ribbons.js
          grep -q 'prefers-reduced-motion' homepage-visual.css
          python - <<'PY'
          from pathlib import Path
          css = Path('homepage-visual.css').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}'), 'homepage-visual.css has unbalanced braces'
          print('OK artwork asset, localized hero slots, ticker accessibility, reduced motion and CSS structure')
          PY

      - name: Verify published full-bleed banner assets
        run: |
          python -m pip install --quiet requests Pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image
          base = "https://zombcash.github.io"
          version = "zoom-mobile-fix-20261110-6-zctv-layout"
          pages = ["index.html", "de/index.html", "fr/index.html", "it/index.html", "ja/index.html", "zh-CN/index.html", "tr/index.html", "hi/index.html", "ru/index.html"]
          for page in pages:
              response = requests.get(f"{base}/{page}?banner-check={version}", timeout=30)
              response.raise_for_status()
              assert f"homepage-visual.css?v={version}" in response.text, f"{page}: stale CSS version"
          css = requests.get(f"{base}/homepage-visual.css?v={version}", timeout=30)
          css.raise_for_status()
          assert "FULL-BLEED TOOL BANNERS" in css.text
          for filename in ["meme-radar.jpg", "zombie-lab.jpg", "survivor-network.jpg"]:
              response = requests.get(f"{base}/assets/tools/{filename}?v={version}", timeout=30)
              response.raise_for_status()
              assert response.headers.get("Content-Type", "").startswith("image/jpeg"), f"{filename}: wrong content type"
              image = Image.open(BytesIO(response.content))
              assert image.size == (1600, 640), f"{filename}: unexpected dimensions {image.size}"
              print(f"OK {filename}: HTTP {response.status_code}, {image.size}, {len(response.content)} bytes")
          print("OK all 9 locale homepages, full-bleed stylesheet, and all 3 published banners")
          PY

      - name: Verify live localized tool video panels and hover behavior
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import requests
          base = "https://zombcash.github.io"
          version = "zoom-mobile-fix-20261110-6-zctv-layout"
          pages = {
              "index.html": "en", "de/index.html": "de", "fr/index.html": "fr",
              "it/index.html": "it", "ja/index.html": "ja", "zh-CN/index.html": "zh-CN",
              "tr/index.html": "tr", "hi/index.html": "hi", "ru/index.html": "ru"
          }
          for path, lang in pages.items():
              r = requests.get(f"{base}/{path}?video-audit={version}", timeout=30)
              r.raise_for_status()
              html = r.text
              assert f'<html lang="{lang}">' in html, f"{path}: wrong/missing lang"
              assert html.count('class="tool-art tool-video-shell') == 3, f"{path}: expected 3 video panels"
              assert html.count('class="tool-card-video"') == 3, f"{path}: expected 3 video elements"
              assert html.count('data-video-card=') == 3, f"{path}: expected 3 video controllers"
              assert 'tool-video-cards.js?v=20261109-2' in html, f"{path}: video controller missing"
              assert f'homepage-visual.css?v={version}' in html, f"{path}: wrong CSS cache version"
              print(f"OK {path} [{lang}]: 3 video panels + controller + current CSS")
          js = requests.get(f"{base}/tool-video-cards.js?v=20261109-2", timeout=30)
          js.raise_for_status()
          for hook in ["pointerenter", "pointerleave", "play(card,false)", "pause(card)", "prefers-reduced-motion"]:
              assert hook in js.text, f"video controller missing {hook}"
          print("OK live video controller: hover-to-play, leave-to-pause, click/tap, reduced-motion guard")
          css = requests.get(f"{base}/homepage-visual.css?v={version}", timeout=30)
          css.raise_for_status()
          text = css.text
          assert "HOTFIX 2026-11-10 — restore the original live video windows" in text
          assert "display:block!important" in text[text.index("HOTFIX 2026-11-10 — restore the original live video windows"):]
          assert "grid-area:video!important" in text[text.index("HOTFIX 2026-11-10 — restore the original live video windows"):]
          for name in ["meme-radar.jpg", "zombie-lab.jpg", "survivor-network.jpg"]:
              r = requests.get(f"{base}/assets/tools/{name}?v={version}", timeout=30)
              r.raise_for_status()
              assert r.headers.get("Content-Type", "").startswith("image/jpeg"), f"{name}: bad content type"
              print(f"OK live background {name}: {len(r.content)} bytes")
          print("PASS: all 9 localized pages, all 3 live video panels, hover controller and 3 backgrounds")
          PY
