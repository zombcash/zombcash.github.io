name: AI Worlds Smoke Tests

on:
  pull_request:
    paths:
      - 'arcade.html'
      - 'ai-arena.js'
      - 'zombie-world.js'
      - 'mcp-server/**'\n      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/ai-worlds-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate browser scripts
        run: |
          node --check ai-arena.js
          node --check zombie-world.js
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run AI Worlds browser interaction tests
        run: node tests/ai-worlds.browser.cjs
      - name: Check deployed Edge Function TypeScript\n        uses: denoland/setup-deno@v2\n        with:\n          deno-version: v2.x\n      - name: Type-check Outbreak MCP Edge Function\n        run: deno check supabase/functions/outbreak-mcp/index.ts\n      - name: Install MCP server dependency
        run: python -m pip install -r mcp-server/requirements.txt
      - name: Compile MCP server
        run: python -m py_compile mcp-server/server.py
      - name: Test MCP match rules
        run: python -m unittest discover -s tests -v
