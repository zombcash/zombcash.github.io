name: Deploy ZombieCash static site to GitHub Pages

on:
  push:
    branches: [main]
    # Tests do not change the published site. Workflow changes are included so
    # fixes to this deployment gate can deploy the current production tree.
    paths-ignore:
      - 'tests/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/update-sitemap-lastmod.yml'
  # Gallery Preview writes generated HTML with GITHUB_TOKEN, so its bot push
  # does not start a follow-up push workflow. Deploy after its successful main run.
  workflow_run:
    workflows: ["Sync Zombie Gallery", "Sync gallery image SEO assets", "Gallery discovery feature preview", "Refresh sitemap lastmod from page history"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (
          github.event.workflow_run.event == 'push' ||
          (
            github.event.workflow_run.name == 'Sync Zombie Gallery' &&
            github.event.workflow_run.event == 'schedule'
          )
        )
      )
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Disable Jekyll processing for static site
        run: touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Clear stale GitHub Pages deployment lock
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const staleSha = 'a4a75ee4be7e1d709267338e7263fc68e568b75f';
            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: staleSha
              });
              core.info('Requested cancellation of stale Pages deployment ' + staleSha);
            } catch (error) {
              core.warning('Stale Pages deployment cancellation returned: ' + error.message);
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 20
          reporting_interval: 10000
