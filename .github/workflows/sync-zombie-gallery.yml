name: Sync Zombie Gallery
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: zombie-gallery-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependency
        run: pip install requests beautifulsoup4 pillow
      - name: Validate and sync gallery
        run: |
          python -m py_compile scripts/sync_gallery.py scripts/export_pinterest_queue.py
          python scripts/sync_gallery.py
      - name: Refresh gated Pinterest queue
        run: python scripts/export_pinterest_queue.py
      - name: Commit gallery and queue updates
        run: |
          if git diff --quiet -- gallery-data.json pinterest-queue.json; then
            echo "Gallery data and Pinterest queue are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json pinterest-queue.json
          git commit -m "Sync Zombie Gallery and gated Pinterest queue"

          # The six-hour SEO job may update generated HTML at the same time.
          # Rebase this data-only commit instead of losing a gallery refresh.
          if git push; then
            exit 0
          fi

          echo "Push raced with another main update; rebasing gallery data."
          git fetch origin main
          if git rebase origin/main; then
            if git push; then
              exit 0
            fi
          else
            echo "Rebase conflicted; regenerate gallery data and queue on current main."
            git rebase --abort
          fi

          # Only this disposable Actions checkout is reset.
          git fetch origin main
          git reset --hard origin/main
          python scripts/sync_gallery.py
          python scripts/export_pinterest_queue.py
          if git diff --quiet -- gallery-data.json pinterest-queue.json; then
            echo "Gallery data and Pinterest queue are current after retry."
            exit 0
          fi
          git add gallery-data.json pinterest-queue.json
          git commit -m "Sync Zombie Gallery and gated Pinterest queue (retry)"
          git push
