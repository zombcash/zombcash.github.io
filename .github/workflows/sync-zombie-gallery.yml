name: Sync Zombie Gallery
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: zombie-gallery-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependency
        run: pip install requests beautifulsoup4
      - name: Sync Telegram gallery
        run: python scripts/sync_gallery.py
      - name: Commit gallery updates
        run: |
          if git diff --quiet -- gallery-data.json; then
            echo "Gallery data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json
          git commit -m "Sync Zombie Gallery from Telegram"
          git push
