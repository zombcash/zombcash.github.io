name: Sync Zombie Gallery
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_gallery.py"
      - ".github/workflows/sync-zombie-gallery.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: zombie-gallery-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependency
        run: pip install requests beautifulsoup4
      - name: Sync Telegram gallery
        run: python scripts/sync_gallery.py
      - name: Commit gallery updates
        run: |
          if git diff --quiet -- gallery-data.json; then
            echo "Gallery data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json
          git commit -m "Sync Zombie Gallery from Telegram"

          # The SEO generator can update sitemaps while this scraper is running.
          # Rebase this data-only commit instead of losing the freshly scraped archive.
          if git push; then
            exit 0
          fi

          echo "Push raced with another gallery/SEO commit; fetching current main."
          git fetch origin main
          if git rebase origin/main; then
            if git push; then
              exit 0
            fi
          else
            echo "Rebase conflicted; regenerate gallery data on current main."
            git rebase --abort
          fi

          # If gallery-data.json itself changed concurrently, rerun the scraper
          # against the newest main rather than overwriting newer editorial metadata.
          git fetch origin main
          git reset --hard origin/main
          python scripts/sync_gallery.py
          if git diff --quiet -- gallery-data.json; then
            echo "Gallery data is current after syncing latest main."
            exit 0
          fi
          git add gallery-data.json
          git commit -m "Sync Zombie Gallery from Telegram (retry)"
          git push
