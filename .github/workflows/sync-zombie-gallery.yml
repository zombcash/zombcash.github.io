name: Sync Zombie Gallery
on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_gallery.py"
      - "gallery-caption-translations.json"
      - "gallery-caption-translations-additions.json"
      - "scripts/sync_gallery_image_seo.py"
      - "scripts/generate_localized_gallery_pages.py"
      - ".github/workflows/sync-zombie-gallery.yml"
      - "tests/gallery-feature-static-smoke.py"
      - "tests/gallery-discovery-smoke.cjs"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
# Rebuild the published static gallery after archive-limit changes.
concurrency:
  group: zombie-gallery-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependency
        run: pip install requests beautifulsoup4
      - name: Sync Telegram gallery
        run: python scripts/sync_gallery.py
      - name: Regenerate crawlable gallery and localized pages
        run: |
          python scripts/sync_gallery_image_seo.py
          python scripts/generate_localized_gallery_pages.py
          python tests/gallery-feature-static-smoke.py
      - name: Commit gallery data, pages and sitemaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-data.json gallery.html sitemap-gallery-images.xml sitemap-gallery-pages.xml robots.txt de/gallery.html fr/gallery.html it/gallery.html ja/gallery.html zh-CN/gallery.html ru/gallery.html tr/gallery.html hi/gallery.html
          if git diff --cached --quiet; then
            echo "Telegram gallery data and generated SEO assets are already current."
            exit 0
          fi
          git commit -m "Sync Zombie Gallery from Telegram"

          # The SEO generator and other site workflows may advance main while
          # Telegram pagination and image metadata are being collected.
          if git push; then
            exit 0
          fi

          echo "Push raced with another gallery/site commit; fetching current main."
          git fetch origin main
          if git rebase origin/main; then
            if git push; then
              exit 0
            fi
          else
            echo "Rebase conflicted; regenerate all gallery outputs on current main."
            git rebase --abort
          fi

          # If source data or editorial metadata changed concurrently, rerun
          # the scraper and both generators against the newest committed main.
          git fetch origin main
          git reset --hard origin/main
          python scripts/sync_gallery.py
          python scripts/sync_gallery_image_seo.py
          python scripts/generate_localized_gallery_pages.py
          python tests/gallery-feature-static-smoke.py
          git add gallery-data.json gallery.html sitemap-gallery-images.xml sitemap-gallery-pages.xml robots.txt de/gallery.html fr/gallery.html it/gallery.html ja/gallery.html zh-CN/gallery.html ru/gallery.html tr/gallery.html hi/gallery.html
          if git diff --cached --quiet; then
            echo "Gallery outputs are current after syncing latest main."
            exit 0
          fi
          git commit -m "Sync Zombie Gallery from Telegram (retry)"
          git push
