name: IndexNow workflow static smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/indexnow.yml"
      - ".github/workflows/sync-gallery-image-seo.yml"
      - ".github/workflows/indexnow-static-smoke.yml"
      - "tests/indexnow-workflow-smoke.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/indexnow.yml"
      - ".github/workflows/sync-gallery-image-seo.yml"
      - ".github/workflows/indexnow-static-smoke.yml"
      - "tests/indexnow-workflow-smoke.py"

permissions:
  contents: read

jobs:
  static-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generated gallery commits reach IndexNow
        run: python tests/indexnow-workflow-smoke.py
