name: ZombieCash PageSpeed Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  pagespeed:
    name: PageSpeed ${{ matrix.strategy }} — ${{ matrix.page }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [mobile, desktop]
        include:
          - page: homepage
            url: https://zombcash.github.io/
          - page: crew-vote
            url: https://zombcash.github.io/crew-vote.html
          - page: survivor-hub
            url: https://zombcash.github.io/survivor-hub.html
          - page: outbreak-transmission
            url: https://zombcash.github.io/outbreak-transmission.html
          - page: german-homepage
            url: https://zombcash.github.io/de/
          - page: japanese-homepage
            url: https://zombcash.github.io/ja/
    steps:
      - name: Run Google PageSpeed Insights
        env:
          PAGE_URL: ${{ matrix.url }}
          STRATEGY: ${{ matrix.strategy }}
          PSI_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${PSI_API_KEY:-}" ]; then
            KEY_PARAM="&key=${PSI_API_KEY}"
          else
            KEY_PARAM=""
          fi
          API_URL="https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${PAGE_URL}&strategy=${STRATEGY}&category=PERFORMANCE&category=ACCESSIBILITY&category=BEST_PRACTICES&category=SEO${KEY_PARAM}"
          HTTP_CODE=$(curl -sS -o psi.json -w '%{http_code}' --retry 2 --retry-delay 3 "$API_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "PageSpeed API failed with HTTP $HTTP_CODE for $PAGE_URL ($STRATEGY)"
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('psi.json'))
              print(json.dumps(d.get('error', d), indent=2)[:4000])
          except Exception:
              print(open('psi.json').read()[:4000])
          PY
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          d=json.load(open('psi.json'))
          cats=d.get('lighthouseResult',{}).get('categories',{})
          audits=d.get('lighthouseResult',{}).get('audits',{})
          def score(k):
              v=cats.get(k,{}).get('score')
              return 'n/a' if v is None else str(round(v*100))
          print('## PageSpeed Insights')
          print('URL:', os.environ['PAGE_URL'])
          print('Strategy:', os.environ['STRATEGY'])
          print('Performance:', score('performance'))
          print('Accessibility:', score('accessibility'))
          print('Best Practices:', score('best-practices'))
          print('SEO:', score('seo'))
          for key in ('first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'):
              a=audits.get(key,{})
              print(f"{key}: {a.get('displayValue','n/a')}")
          PY
