name: Search Console URL Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Google API client
        run: python -m pip install --disable-pip-version-check requests google-api-python-client google-auth

      - name: Inspect every sitemap URL in Google Search
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          import requests
          import csv
          import xml.etree.ElementTree as ET
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          site_url = "https://zombcash.github.io/"
          sitemap_url = "https://zombcash.github.io/sitemap.xml"
          raw = os.environ.get("GSC_SERVICE_ACCOUNT_JSON", "")
          if not raw.strip():
              raise SystemExit("ERROR: GitHub Secret GSC_SERVICE_ACCOUNT_JSON is missing or empty.")

          response = requests.get(sitemap_url, timeout=30)
          print(f"Sitemap HTTP: {response.status_code}")
          response.raise_for_status()
          root = ET.fromstring(response.content)
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = list(dict.fromkeys((node.text or "").strip() for node in root.findall("sm:url/sm:loc", ns) if (node.text or "").strip()))
          if not urls:
              raise SystemExit("ERROR: No URL entries found in sitemap.")
          if any(not url.startswith(site_url) for url in urls):
              raise SystemExit("ERROR: Sitemap includes a URL outside the configured Search Console property.")
          print(f"Unique URLs discovered in sitemap: {len(urls)}")

          info = json.loads(raw)
          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/webmasters"]
          )
          service = build("searchconsole", "v1", credentials=credentials, cache_discovery=False)
          print(f"Service account: {info.get('client_email', '(email missing)')}")
          print(f"Property: {site_url}")

          counts = {}
          errors = []
          records = []
          for number, url in enumerate(urls, start=1):
              print("\\n" + "=" * 78)
              print(f"[{number}/{len(urls)}] URL: {url}")
              data = None
              for attempt in range(1, 4):
                  try:
                      data = service.urlInspection().index().inspect(
                          body={"inspectionUrl": url, "siteUrl": site_url, "languageCode": "en-US"}
                      ).execute()
                      break
                  except HttpError as exc:
                      if exc.resp.status in (429, 500, 502, 503, 504) and attempt < 3:
                          print(f"Temporary HTTP {exc.resp.status}; retry {attempt}/3 after {attempt * 3}s.")
                          time.sleep(attempt * 3)
                          continue
                      msg = f"HTTP {exc.resp.status}: {exc.content.decode('utf-8', errors='replace')[:500]}"
                      print(f"API ERROR: {msg}")
                      errors.append((url, msg))
                      break
                  except Exception as exc:
                      msg = f"{type(exc).__name__}: {exc}"
                      print(f"ERROR: {msg}")
                      errors.append((url, msg))
                      break
              if data is None:
                  counts["API_ERROR"] = counts.get("API_ERROR", 0) + 1
                  records.append({
                      "url": url, "verdict": "API_ERROR", "coverageState": "API_ERROR",
                      "indexingState": "", "robotsTxtState": "", "pageFetchState": "",
                      "lastCrawlTime": "", "googleCanonical": "", "userCanonical": "",
                      "sitemap": "", "referringUrls": "", "apiError": errors[-1][1] if errors else "No response",
                  })
                  if errors and ("API is not enabled" in errors[-1][1] or "PERMISSION_DENIED" in errors[-1][1] or "insufficient authentication scopes" in errors[-1][1]):
                      print("Stopping early because the inspection service or credentials are not authorized; remaining URLs will be marked NOT_RUN.")
                      for remaining in urls[number:]:
                          records.append({
                              "url": remaining, "verdict": "NOT_RUN", "coverageState": "NOT_RUN",
                              "indexingState": "", "robotsTxtState": "", "pageFetchState": "",
                              "lastCrawlTime": "", "googleCanonical": "", "userCanonical": "",
                              "sitemap": "", "referringUrls": "", "apiError": "Not attempted after a service/permission error",
                          })
                      break
                  continue
              index = data.get("inspectionResult", {}).get("indexStatusResult", {})
              verdict = index.get("verdict", "NOT_RETURNED")
              state = index.get("coverageState", "NOT_RETURNED")
              counts[state] = counts.get(state, 0) + 1
              records.append({
                  "url": url,
                  "verdict": verdict,
                  "coverageState": state,
                  "indexingState": index.get("indexingState", ""),
                  "robotsTxtState": index.get("robotsTxtState", ""),
                  "pageFetchState": index.get("pageFetchState", ""),
                  "lastCrawlTime": index.get("lastCrawlTime", ""),
                  "googleCanonical": index.get("googleCanonical", ""),
                  "userCanonical": index.get("userCanonical", ""),
                  "sitemap": "; ".join(index.get("sitemap", [])) if isinstance(index.get("sitemap", []), list) else index.get("sitemap", ""),
                  "referringUrls": "; ".join(index.get("referringUrls", [])) if isinstance(index.get("referringUrls", []), list) else index.get("referringUrls", ""),
                  "apiError": "",
              })
              print(f"Verdict: {verdict}")
              print(f"Coverage state: {state}")
              print(f"Indexing state: {index.get('indexingState', 'NOT_RETURNED')}")
              print(f"Last crawl: {index.get('lastCrawlTime', 'NOT_RETURNED')}")
              print(f"Page fetch: {index.get('pageFetchState', 'NOT_RETURNED')}")
              print(f"Robots.txt state: {index.get('robotsTxtState', 'NOT_RETURNED')}")
              print(f"Google canonical: {index.get('googleCanonical', 'NOT_RETURNED')}")
              print(f"User canonical: {index.get('userCanonical', 'NOT_RETURNED')}")
              # Respect service quota; URL Inspection has per-site daily limits.
              time.sleep(1)

          print("\\n" + "=" * 78)
          print("SUMMARY")
          print(f"Total unique sitemap URLs: {len(urls)}")
          for state, count in sorted(counts.items()):
              print(f"{state}: {count}")
          print(f"API errors: {len(errors)}")
          if errors:
              print("URLS WITH API ERRORS:")
              for url, error in errors:
                  print(f"- {url}: {error}")
          fields = [
              "url", "verdict", "coverageState", "indexingState", "robotsTxtState",
              "pageFetchState", "lastCrawlTime", "googleCanonical", "userCanonical",
              "sitemap", "referringUrls", "apiError",
          ]
          with open("search-console-url-inspection.csv", "w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(records)
          with open("search-console-url-inspection.json", "w", encoding="utf-8") as handle:
              json.dump({"property": site_url, "sitemap": sitemap_url, "totalUniqueUrls": len(urls),
                         "inspectedOrRecorded": len(records), "coverageStateCounts": counts,
                         "apiErrorCount": len(errors), "records": records}, handle, ensure_ascii=False, indent=2)
          print("Inspection is a snapshot of Google's available data; it does not itself request indexing.")
          PY

      - name: Upload URL inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-console-url-inspection
          path: |
            search-console-url-inspection.csv
            search-console-url-inspection.json
          if-no-files-found: warn
          retention-days: 14
