name: Refresh sitemap lastmod from page history
# Deploy and Search Console submission workflows listen for this run's completion.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "sitemap-zombie-fiction.xml"
      - "scripts/update_sitemap_lastmod.py"
      - "tests/sitemap-lastmod-smoke.py"
      - ".github/workflows/update-sitemap-lastmod.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - "sitemap-zombie-fiction.xml"
      - "scripts/update_sitemap_lastmod.py"
      - "tests/sitemap-lastmod-smoke.py"
      - ".github/workflows/update-sitemap-lastmod.yml"

permissions:
  contents: write

concurrency:
  group: sitemap-lastmod-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh and validate every sitemap lastmod
        run: |
          python -m py_compile scripts/update_sitemap_lastmod.py tests/sitemap-lastmod-smoke.py
          python scripts/update_sitemap_lastmod.py
          python tests/sitemap-lastmod-smoke.py

      - name: Commit updated sitemap dates
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-zombie-fiction.xml
          if git diff --cached --quiet; then
            echo "Sitemap lastmod values are already current."
            exit 0
          fi
          git commit -m "Refresh sitemap lastmod from page history"
          if git push; then
            exit 0
          fi

          echo "Main advanced during the sitemap update; rebasing and recalculating."
          git fetch origin main
          git rebase origin/main
          python scripts/update_sitemap_lastmod.py
          python tests/sitemap-lastmod-smoke.py
          git add sitemap.xml sitemap-zombie-fiction.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --amend --no-edit
          git push
