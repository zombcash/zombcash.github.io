name: Roulette visual and functional audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'roulette.html'
      - '*/roulette.html'
      - 'roulette.js'
      - 'language.js'
      - 'sitemap.xml'
      - 'tests/roulette-audit-smoke.cjs'
      - 'tests/roulette-css-smoke.py'
      - 'roulette-page.css'
      - '.github/workflows/roulette-audit.yml'
  push:
    branches: [main]
    paths:
      - 'roulette.html'
      - '*/roulette.html'
      - 'roulette.js'
      - 'language.js'
      - 'sitemap.xml'
      - 'tests/roulette-audit-smoke.cjs'
      - '.github/workflows/roulette-audit.yml'

permissions:
  contents: read

concurrency:
  group: roulette-audit-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  roulette-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: http://127.0.0.1:4173/
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check roulette.js
          node --check tests/roulette-audit-smoke.cjs

      - name: Verify externalized Roulette CSS
        run: python tests/roulette-css-smoke.py
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright axe-core
          npx playwright install chromium
      - name: Serve site for browser audit
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/roulette-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/roulette.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-preview.log
          exit 1
      - name: Run roulette locale, viewport, wallet and spin checks
        run: node tests/roulette-audit-smoke.cjs
      - name: Upload roulette screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-audit-evidence
          path: roulette-audit-results/
          if-no-files-found: ignore
          retention-days: 14
